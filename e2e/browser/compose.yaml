# Mirrors the production deployment from the root README.md. Only the browser publishes a port:
# the application is reached over this project's network, as a user's browser reaches a deployment.
services:
  databasus:
    image: ${E2E_IMAGE:?}
    pull_policy: never
    environment:
      IS_DISABLE_ANONYMOUS_TELEMETRY: "true"
    volumes:
      - databasus-data:/databasus-data
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 1s

  # An independently initialized installation the recovery scenario replaces through the browser.
  databasus-target:
    image: ${E2E_IMAGE:?}
    pull_policy: never
    environment:
      IS_DISABLE_ANONYMOUS_TELEMETRY: "true"
    volumes:
      - databasus-target-data:/databasus-data
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 1s

  # An installation with a mail server, for the scenarios that read mail: the emailed sign-in code.
  # The other installations have none, as a fresh deployment from the README.
  databasus-mail:
    image: ${E2E_IMAGE:?}
    pull_policy: never
    environment:
      IS_DISABLE_ANONYMOUS_TELEMETRY: "true"
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_FROM: databasus@example.com
      SMTP_SECURITY: none
    depends_on:
      mail:
        condition: service_healthy
    volumes:
      - databasus-mail-data:/databasus-data
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 1s

  # Keeps every message it receives and answers them over its HTTP API, which the scenarios read
  # through the browser, as the only service on this network they can reach.
  mail:
    image: docker.io/axllent/mailpit:v1.20.5@sha256:cd75e91719cace4e3100eab9f848ecf2ecdd7f4db01e1573a0114769dad4ba2e
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  databases:
    image: docker.io/library/postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
    environment:
      POSTGRES_DB: e2e_backed_up
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: ${E2E_DATABASE_PASSWORD:?}
    volumes:
      - ./prepare_source.sh:/docker-entrypoint-initdb.d/prepare-source.sh:ro,z
    command: ["postgres", "-c", "wal_level=replica", "-c", "summarize_wal=on", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=e2e", "--dbname=e2e_backed_up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  recovery-engine:
    image: docker.io/library/docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    entrypoint: ["dockerd"]
    command: ["--host=unix:///run/recovery-engine/docker.sock", "--storage-driver=overlay2"]
    volumes:
      - recovery-socket:/run/recovery-engine
      - recovery-engine-data:/var/lib/docker
      - recovery-work:/restore-work
    healthcheck:
      test: ["CMD", "docker", "--host=unix:///run/recovery-engine/docker.sock", "info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  recovery:
    image: docker.io/library/postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
    init: true
    entrypoint: ["sh", "/prepare-recovery.sh"]
    environment:
      DOCKER_HOST: unix:///run/recovery-engine/docker.sock
      E2E_POSTGRES_IMAGE: ${E2E_POSTGRES_IMAGE:?}
    depends_on:
      recovery-engine:
        condition: service_healthy
    volumes:
      - ./prepare_recovery.sh:/prepare-recovery.sh:ro,z
      - ${E2E_POSTGRES_ARCHIVE:?}:/postgres.tar:ro,z
      - recovery-socket:/run/recovery-engine
      - recovery-work:/restore-work
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/recovery-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 1s

  # The server is the driver of the locked Python Playwright package, so nothing is downloaded at run time.
  # This image supplies the browsers of that version: pyproject.toml pins the same one.
  browser:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    init: true
    shm_size: 1g
    user: pwuser
    command: ["/playwright-driver/node", "/playwright-driver/package/cli.js", "run-server", "--port=3000", "--host=0.0.0.0"]
    volumes:
      - ${E2E_PLAYWRIGHT_DRIVER:?}:/playwright-driver:ro,z
    ports:
      - "127.0.0.1::3000"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

networks:
  default:
    ipam:
      config:
        - subnet: ${E2E_NETWORK_SUBNET:?}

volumes:
  databasus-data:
  databasus-target-data:
  databasus-mail-data:
  recovery-socket:
  recovery-engine-data:
  recovery-work:
