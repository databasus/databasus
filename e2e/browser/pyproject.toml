[project]
name = "databasus-browser-e2e"
version = "0"
requires-python = ">=3.14"
# compose.yaml pins the Playwright browser image of the same version.
dependencies = ["playwright==1.64.1", "pytest==9.0.3"]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:cacheprovider --tb=short -ra"
tmp_path_retention_policy = "none"
