      operationId: listDatabases
      tags: [databases]
      summary: List the databases of a workspace
      description: >-
        Ordered by name, then by ID. With `notifierId`, only the databases that use that notifier are
        listed. A user who is not a member of the workspace gets 404 `not_found`. Secrets are never
        returned.
      parameters:
        - name: workspaceId
          in: query
          required: true
          description: The workspace whose databases to list
          schema:
            type: string
            format: uuid
        - name: notifierId
          in: query
          description: A notifier the listed databases use
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: The largest number of databases on the page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
      responses:
        "200":
          description: One page of databases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabasePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDatabase
      tags: [databases]
      summary: Create a database in a workspace
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in the workspace. The type in `settings` is fixed
        once the database exists. The backend connects first and saves what the server reports, such
        as its version. Settings the type refuses get 400 `invalid_request` with the field in
        `errors`; a server that cannot be reached or refuses the connection gets 400
        `database_connection_failed` with the server's reason in `detail`. Every notifier must belong
        to the workspace.
      requestBody:
        description: The database to create, with every secret its type needs.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseCreate"
      responses:
        "201":
          description: The database as it was saved, without its secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /databases/{databaseId}:
    parameters:
      - $ref: "#/components/parameters/DatabaseId"
    get:
      operationId: getDatabase
      tags: [databases]
      summary: Get a database without its secrets
      description: >-
        A user who is not a member of the database's workspace gets 404 `not_found`, as for a
        database that does not exist.
      responses:
        "200":
          description: The database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateDatabase
      tags: [databases]
      summary: Replace the name, the settings and the notifiers of a database
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. A secret the request leaves out keeps its stored
        value while the address it is used at stays the stored one. The password and the PostgreSQL
        client key follow the database's resource address: its host, its port, the address of its SSH
        tunnel and, for MongoDB, the SRV flag. The SSH secrets follow the tunnel's resource address:
        whether it is enabled, and its host and port while it is. At another address, a secret the
        settings use must be sent again or the answer is 400 `invalid_request` with a field error, and
        a secret they no longer use is removed. Settings of another type than the database's get 400
        `invalid_request`. The backend
        connects with the resulting settings first; when that fails, the answer is 400
        `database_connection_failed`, and the database keeps its stored settings.
      requestBody:
        description: The editable fields of the database.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseUpdate"
      responses:
        "200":
          description: The database after the change, without its secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDatabase
      tags: [databases]
      summary: Delete a database with its backups
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. The database, its settings, its notifier
        attachments, its backup configs and the records of its backups and WAL go in one step, and
        the files of those backups are handed to the deletion worker. While a logical backup of the
        database is in progress, the answer is 409 `in_use`, and nothing is deleted. A running
        physical backup is cancelled, the WAL stream stopped and the replication slots dropped only
        after the deletion has succeeded.
      responses:
        "204":
          description: The database is deleted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /databases/{databaseId}/copy:
    parameters:
      - $ref: "#/components/parameters/DatabaseId"
    post:
      operationId: copyDatabase
      tags: [databases]
      summary: Copy a database within its workspace
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. The copy is named after the original with
        ` (Copy)` appended and has the same type, settings, secrets and notifiers, no backup history
        and, for physical PostgreSQL, a replication slot of its own. The copy does not connect.
      responses:
        "201":
          description: The copy, without its secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /databases/{databaseId}/test:
    parameters:
      - $ref: "#/components/parameters/DatabaseId"
    post:
      operationId: testDatabase
      tags: [databases]
      summary: Test the connection of a saved database
      description: >-
        Any member of the workspace may test, a viewer included. A connection the server refuses is
        still a 200 that reports the reason. The test changes nothing in the database, its last
        backup error included.
      responses:
        "200":
          description: Whether the database could be connected to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseTestResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /database-tests:
    post:
      operationId: testDatabaseSettings
      tags: [databases]
      summary: Test the connection with settings that are not saved
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in the workspace, because a test connects wherever
        the request points. With `databaseId`, a secret the request leaves out is taken from that
        database, which must belong to the same workspace, or the answer is 404 `not_found`; settings
        of another type than that database's get 400 `invalid_request`. With another resource address
        than the database's, a secret the settings use must be sent again or the answer is 400
        `invalid_request`, as in `updateDatabase`. Nothing connects on a refusal, and nothing is
        saved.
      requestBody:
        description: The settings to test.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseSettingsTarget"
      responses:
        "200":
          description: Whether the database could be connected to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseTestResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /limited-user-checks:
    post:
      operationId: checkLimitedUser
      tags: [databases]
      summary: Check whether the connecting user may do more than a backup needs
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in the workspace, for the reason
        `testDatabaseSettings` gives, and refuses the same requests, including a secret left out at
        another resource address, which gets 400 `invalid_request`. For physical PostgreSQL the
        check is about a replication-only user, for the other types about a read-only user. A
        server that cannot be reached gets 400 `database_connection_failed`.
      requestBody:
        description: The settings to connect with.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseSettingsTarget"
      responses:
        "200":
          description: Whether a limited user is advisable, and why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitedUserCheck"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /limited-users:
    post:
      operationId: createLimitedUser
      tags: [databases]
      summary: Create a limited user on the database's server
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in the workspace, for the reason
        `testDatabaseSettings` gives, and refuses the same requests, including a secret left out at
        another resource address, which gets 400 `invalid_request`. Creates a read-only user, or for
        physical PostgreSQL a replication-only user, with a generated name and password. The password
        is returned only in this answer; the database itself is not changed.
      requestBody:
        description: The settings to connect with.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseSettingsTarget"
      responses:
        "201":
          description: The created user with its password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitedUser"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /databases/{databaseId}/transfer:
    parameters:
      - $ref: "#/components/parameters/DatabaseId"
    post:
      operationId: transferDatabase
      tags: [backups]
      summary: Move a database to another workspace
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in both workspaces, because the move gives the
        target workspace's members the database's stored secrets. The database either takes its
        storage along or switches to a storage of the target workspace; a database whose config was
        never saved then gets the default config of its method with that storage. Moving the storage
        gets 409 `in_use` while another database backs up into it. The move happens completely or not
        at all. SWITCH_TO_STORAGE commits removal of the old backup history and queues file cleanup
        in the background. MOVE_WITH_DATABASE preserves history. Both options return 204 after commit.
      requestBody:
        description: The target workspace and what happens to the storage and the notifiers.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTransfer"
      responses:
        "204":
          description: The database belongs to the target workspace
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /backup-configs:
    get:
      operationId: listBackupConfigs
      tags: [backups]
      summary: List the saved backup configs of a workspace or of a storage
      description: >-
        Takes exactly one of `workspaceId` and `storageId`; both or neither get 400
        `invalid_request`. Ordered by database ID. A database whose config was never saved is not
        listed. A user who is not a member of the workspace, or of the storage's workspace, gets 404
        `not_found`. Cleanup summaries also require view access to each database's current workspace;
        storage ownership alone does not grant that access.
      parameters:
        - name: workspaceId
          in: query
          description: The workspace whose databases' configs to list
          schema:
            type: string
            format: uuid
        - name: storageId
          in: query
          description: The storage whose configs to list, the ones that back up into it
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: The largest number of configs on the page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
      responses:
        "200":
          description: One page of backup configs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfigPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /backup-configs/{databaseId}:
    parameters:
      - $ref: "#/components/parameters/BackupConfigDatabaseId"
    get:
      operationId: getBackupConfig
      tags: [backups]
      summary: Get the backup config of a database
      description: >-
        A config that was never saved reads as the default of the database's method, and the read
        stores nothing. A user who is not a member of the database's workspace gets 404 `not_found`.
      responses:
        "200":
          description: The backup config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfig"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateBackupConfig
      tags: [backups]
      summary: Save the backup config of a database
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. The settings must be of the database's method,
        and a physical config must fit the database's physical backup type; otherwise the answer is
        400 `invalid_request` with the field in `errors`. A storage that is not in the database's
        workspace gets 400 `invalid_request`. A logical config saved with another storage removes
        the database's logical backups in the same step, and gets 409 `in_use` while one of them is
        running. Every successful save returns 200 with the saved config and computed current cleanup
        counts. File cleanup runs independently in the background.
      requestBody:
        description: The editable fields of the config.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupConfigInput"
      responses:
        "200":
          description: The config as it was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfig"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /physical-backups:
    get:
      operationId: "listPhysicalBackups"
      tags:
        - "backups"
      summary: "List the physical backups of a database"
      description: "Needs WORKSPACE_VIEWER. Ordered newest first by creation time and ID. Includes full backups, incremental backups and WAL ranges. totalUsageMb covers every backup of the database, independently of the page and filters. An outsider gets 404 not_found; a nonphysical database, invalid limit or malformed cursor gets 400 invalid_request."
      parameters:
        - {"name": "databaseId", "in": "query", "required": true, "description": "The database whose backups to list", "schema": {"type": "string", "format": "uuid"}}
        - {"name": "type", "in": "query", "required": false, "description": "Only these backup types", "schema": {"type": "array", "items": {"$ref": "#/components/schemas/PhysicalBackupListRowType"}}, "style": "form", "explode": true}
        - {"name": "status", "in": "query", "required": false, "description": "Only these backup statuses", "schema": {"type": "array", "items": {"$ref": "#/components/schemas/PhysicalBackupStatus"}}, "style": "form", "explode": true}
        - {"name": "createdBefore", "in": "query", "required": false, "description": "Only rows created before this time", "schema": {"type": "string", "format": "date-time"}}
        - {"name": "limit", "in": "query", "required": false, "description": "The largest number of rows on the page", "schema": {"type": "integer", "minimum": 1, "maximum": 1000, "default": 50}}
        - {"name": "after", "in": "query", "required": false, "description": "The nextCursor of the previous page", "schema": {"type": "string"}}
      responses:
        "200":
          description: "List the physical backups of a database"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicalBackupPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: "startPhysicalBackup"
      tags:
        - "backups"
      summary: "Request a physical backup"
      description: "Needs WORKSPACE_MEMBER. Records the request and answers with no body, because the scheduler creates the backup on its next pass, once an earlier backup of the database has ended; the backup then appears in listPhysicalBackups. AUTO chooses an incremental when the backup type supports it and a chain can be extended, otherwise a full backup. An incremental without an extendable chain gets 409 no_extendable_chain. A nonphysical database, a database with backups turned off or a database whose config names no storage gets 400 invalid_request, and nothing is recorded."
      requestBody:
        description: "The request to apply"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysicalBackupStart"
      responses:
        "202":
          description: "Request a physical backup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /physical-backups/{backupId}:
    parameters:
      - {"$ref": "#/components/parameters/PhysicalBackupId"}
    delete:
      operationId: "deletePhysicalBackup"
      tags:
        - "backups"
      summary: "Delete a physical backup and its descendants"
      description: "Needs WORKSPACE_MEMBER. Stops a running backup before deleting it. A full backup removes its incremental chain; an incremental removes its descendants. A WAL segment ID gets 404 not_found and deletes nothing."
      responses:
        "204":
          description: "Delete a physical backup and its descendants"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /physical-backups/{backupId}/cancel:
    parameters:
      - {"$ref": "#/components/parameters/PhysicalBackupId"}
    post:
      operationId: "cancelPhysicalBackup"
      tags:
        - "backups"
      summary: "Cancel a running physical backup"
      description: "Needs WORKSPACE_MEMBER. Records the backup as CANCELED and answers with it in that final status, as listPhysicalBackups shows it; its process stops afterwards. A finished backup gets 409 not_running."
      responses:
        "200":
          description: "The backup in its final status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicalBackupListRow"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /physical-restore-tokens:
    post:
      operationId: "createPhysicalRestoreToken"
      tags:
        - "backups"
      summary: "Issue a token for one physical restore set"
      description: "Needs WORKSPACE_VIEWER. The token expires in 15 minutes. A database without a completed full backup or an unrestorable backup gets 409 no_restorable_backup. An unreachable target time gets 409 target_time_unreachable, with the latest restorable LSN in the detail for a WAL gap. A running download or restore stream gets 409 already_running. A nonphysical database gets 400 invalid_request."
      requestBody:
        description: "The request to apply"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysicalRestoreTokenCreate"
      responses:
        "201":
          description: "Issue a token for one physical restore set"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicalRestoreToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /physical-restore-sets:
    get:
      operationId: "downloadPhysicalRestoreSet"
      tags:
        - "backups"
      summary: "Download a physical restore set"
      description: "Public because the single-use restore token is the credential; a browser link cannot carry a session. Consumes the token before acquiring the user stream. Unknown, expired and used tokens get 401 unauthenticated. A running user stream gets 409 already_running and spends the token. A restore set that can no longer be built gets the same problem as at token issue. Streams the archive without HTTP gzip, even when the client accepts gzip. The complete archive length is not required in advance; Content-Length may be absent."
      x-access: "public"
      parameters:
        - {"name": "token", "in": "query", "required": true, "description": "The single-use restore token", "schema": {"type": "string"}}
      responses:
        "200":
          description: "Download a physical restore set"
          content:
            application/x-tar:
              schema:
                type: "string"
                format: "binary"
          headers:
            Content-Disposition:
              description: "The archive or script file name"
              schema:
                type: "string"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /physical-recovery-scripts:
    get:
      operationId: "getRecoveryScript"
      tags:
        - "backups"
      summary: "Get the physical recovery script"
      description: "Public because this static script contains no instance address or credentials. Takes a restore set URL or path and an output directory as arguments."
      x-access: "public"
      responses:
        "200":
          description: "Get the physical recovery script"
          content:
            text/x-shellscript:
              schema:
                type: "string"
                format: "binary"
          headers:
            Content-Disposition:
              description: "The archive or script file name"
              schema:
                type: "string"
        default:
          $ref: "#/components/responses/Problem"
  /wal-streams/{databaseId}:
    parameters:
      - {"$ref": "#/components/parameters/DatabaseId"}
    get:
      operationId: "getWalStream"
      tags:
        - "backups"
      summary: "Read the current values of a WAL stream"
      description: "Needs WORKSPACE_VIEWER. An outsider or missing database gets 404 not_found. A nonphysical database gets 400 invalid_request. Source-side values come from the streamer probes and open no connection to the source."
      responses:
        "200":
          description: "Read the current values of a WAL stream"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalStreamLive"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /wal-streams/{databaseId}/statistics:
    parameters:
      - {"$ref": "#/components/parameters/DatabaseId"}
    get:
      operationId: "getWalStreamStatistics"
      tags:
        - "backups"
      summary: "Read the statistics of a WAL stream"
      description: "Needs WORKSPACE_VIEWER. An outsider or missing database gets 404 not_found. A nonphysical database gets 400 invalid_request. Source-side values come from the streamer probes and open no connection to the source."
      parameters:
        - {"name": "period", "in": "query", "required": true, "description": "The statistics window", "schema": {"$ref": "#/components/schemas/WalStreamStatisticsPeriod"}}
      responses:
        "200":
          description: "Read the statistics of a WAL stream"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalStreamStatistics"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /logical-backups:
    get:
      operationId: listLogicalBackups
      tags: [backups]
      summary: List the logical backups of a database
      description: >-
        Ordered newest first by creation time, then by ID. `status` and `createdBefore` filter the
        list. A user who is not a member of the database's workspace gets 404 `not_found`. A cursor
        this list did not issue gets 400 `invalid_request`.
      parameters:
        - name: databaseId
          in: query
          required: true
          description: The database whose backups to list
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Only backups in one of these statuses
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LogicalBackupStatus"
        - name: createdBefore
          in: query
          description: Only backups made before this time
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: The largest number of backups on the page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
      responses:
        "200":
          description: One page of backups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogicalBackupPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startLogicalBackup
      tags: [backups]
      summary: Start a backup of a database
      description: >-
        Needs the role `WORKSPACE_VIEWER` or higher. Answers at once with the backup in
        `IN_PROGRESS`; `getLogicalBackup` follows it. A backup of the database that is already
        running gets 409 `already_running`. A database whose config names no storage, or a physical
        PostgreSQL database, gets 400 `invalid_request`.
      requestBody:
        description: The database to back up.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogicalBackupStart"
      responses:
        "202":
          description: The backup started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogicalBackup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /logical-backups/{backupId}:
    parameters:
      - $ref: "#/components/parameters/BackupId"
    get:
      operationId: getLogicalBackup
      tags: [backups]
      summary: Get a logical backup
      description: A user who is not a member of the database's workspace gets 404 `not_found`.
      responses:
        "200":
          description: The backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogicalBackup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLogicalBackup
      tags: [backups]
      summary: Delete a logical backup and its file
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. Removes the backup and requests the deletion of
        its file and its metadata file in one step. A running backup gets 409 `already_running`, and
        a backup a running restore reads gets 409 `in_use`; neither changes anything.
      responses:
        "204":
          description: The backup is deleted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /logical-backups/{backupId}/cancel:
    parameters:
      - $ref: "#/components/parameters/BackupId"
    post:
      operationId: cancelLogicalBackup
      tags: [backups]
      summary: Cancel a running logical backup
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. Stops the dump tool and every process it
        started; the backup then shows `CANCELED`. A backup that is no longer running gets 409
        `not_running` and stays as it is.
      responses:
        "202":
          description: The backup is being cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogicalBackup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /logical-backups/{backupId}/file:
    parameters:
      - $ref: "#/components/parameters/BackupId"
    get:
      operationId: downloadLogicalBackup
      tags: [backups]
      x-access: public
      summary: Download the file of a logical backup
      description: >-
        Public, because a browser link cannot carry the session: the single-use `token` from
        `createDownloadToken` is the credential. Returns the decrypted file. An expired, used,
        unknown or mismatched token gets 401 `unauthenticated`. While another download or restore
        stream of the token's user runs, the request gets 409 `already_running` and the token stays
        usable. Streams the file without HTTP gzip, even when the client accepts gzip, and includes
        Content-Length equal to the decrypted file's exact byte count in its existing compression
        format. Encryption overhead in storage is not included in that length.
      parameters:
        - name: token
          in: query
          required: true
          description: The download token issued for this backup
          schema:
            type: string
      responses:
        "200":
          description: The decrypted backup file
          headers:
            Content-Disposition:
              description: The file name of the backup
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /download-tokens:
    post:
      operationId: createDownloadToken
      tags: [backups]
      summary: Issue a single-use token to download a backup file
      description: >-
        Needs the role `WORKSPACE_VIEWER` or higher. The token downloads the backup once and expires
        after five minutes. While another download or restore stream of the user runs, the request
        gets 409 `already_running` and no token is issued.
      requestBody:
        description: The backup to download.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadTokenCreate"
      responses:
        "201":
          description: The issued token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /restores:
    get:
      operationId: listRestores
      tags: [backups]
      summary: List the restores of a logical backup
      description: >-
        Ordered newest first by creation time, then by ID. A user who is not a member of the
        backup's workspace gets 404 `not_found`.
      parameters:
        - name: backupId
          in: query
          required: true
          description: The backup whose restores to list
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: The largest number of restores on the page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
      responses:
        "200":
          description: One page of restores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startRestore
      tags: [backups]
      summary: Restore a logical backup into a target database
      description: >-
        Needs the role `WORKSPACE_VIEWER` or higher. Connects to the target and detects its version
        before it answers, then answers at once with the restore in `IN_PROGRESS`; `getRestore`
        follows it. A backup that is not completed, a target of another engine or a target whose
        version cannot take the backup gets 400 `invalid_request`. A target that cannot be reached
        or refuses the credentials gets 400 `database_connection_failed`. A restore into the same
        database that is already running gets 409 `already_running`. A PostgreSQL restore that
        needs the archive as a file and lacks disk space gets 409 `insufficient_disk_space`, whose
        `detail` names the bytes needed and free. The target's secrets are used only by the running
        restore and are never stored.
      requestBody:
        description: The backup and the target to restore it into.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreStart"
      responses:
        "202":
          description: The restore started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restore"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /restores/{restoreId}:
    parameters:
      - $ref: "#/components/parameters/RestoreId"
    get:
      operationId: getRestore
      tags: [backups]
      summary: Get a restore
      description: >-
        Holds no field of the target. A user who is not a member of the backup's workspace gets 404
        `not_found`.
      responses:
        "200":
          description: The restore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restore"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /restores/{restoreId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RestoreId"
    post:
      operationId: cancelRestore
      tags: [backups]
      summary: Cancel a running restore
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. Stops the restore tool and every process it
        started, also while the backup is still read from storage; the restore then shows
        `CANCELED`. A restore that is no longer running gets 409 `not_running` and stays as it is.
      responses:
        "202":
          description: The restore is being cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restore"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
