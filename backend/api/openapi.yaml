        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createNotifier
      tags: [notifiers]
      summary: Create a notifier in a workspace
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in the workspace. The type in `settings` is
