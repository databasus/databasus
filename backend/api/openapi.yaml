            application/json:
              schema:
                $ref: "#/components/schemas/Notifier"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /notifiers/{notifierId}:
    parameters:
      - $ref: "#/components/parameters/NotifierId"
    get:
      operationId: getNotifier
      tags: [notifiers]
      summary: Get a notifier without its secrets
      description: >-
        A user who is not a member of the notifier's workspace gets 404 `not_found`, as for a
        notifier that does not exist.
      responses:
        "200":
          description: The notifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifier"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateNotifier
      tags: [notifiers]
      summary: Replace the name and the settings of a notifier
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. A secret the request leaves out keeps its
        stored value, and a webhook header sent without a value keeps the stored value of the
        header with the same name, while the notifier's resource address stays the stored one: the
        SMTP host and port, the Telegram Bot API URL and proxy, the Mattermost server URL or the
        webhook URL. With another resource address, a secret the settings use must be sent again or
        the answer is 400 `invalid_request` with a field error, and a secret they no longer use is
        removed. Settings of another type than the notifier's get 400 `invalid_request`, because the
        type is fixed when the notifier is created.
      requestBody:
        description: The editable fields of the notifier.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierUpdate"
      responses:
        "200":
          description: The notifier after the change, without its secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifier"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteNotifier
      tags: [notifiers]
      summary: Delete a notifier
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. A notifier that a database uses gets 409
        `in_use`, and nothing is deleted.
      responses:
        "204":
          description: The notifier is deleted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /notifiers/{notifierId}/test:
    parameters:
      - $ref: "#/components/parameters/NotifierId"
    post:
      operationId: testNotifier
      tags: [notifiers]
      summary: Send a test message through a saved notifier
      description: >-
        Any member of the workspace may test, a viewer included. A message the channel refuses is
        still a 200 that reports the channel's error, and the outcome becomes the notifier's
