  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [workspaces]
      summary: List audit events
      description: >-
        Ordered by `createdAt`, the newest first, then by ID. The filters choose the view and its
        readers. With `workspaceId`, the events of that workspace, readable by its members of every
        role and by instance admins; a user who is not a member gets 404 `not_found`. With only
        `authorUserId`, the events that user authored, readable by that user and by instance admins.
        Without a filter, the events of the whole instance, readable only by instance admins. Any
        other reader gets 403 `permission_denied`. Both filters together list the events of one
        author in the workspace.
      parameters:
        - name: workspaceId
          in: query
          description: The workspace whose events to list
          schema:
            type: string
            format: uuid
        - name: authorUserId
          in: query
          description: The user whose events to list
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: The largest number of events on the page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: after
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
      responses:
        "200":
          description: One page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /notifiers:
