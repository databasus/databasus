        `not_found`. Secrets are never returned.
      parameters:
        - name: workspaceId
          in: query
          required: true
          description: The workspace whose storages to list
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: The largest number of storages on the page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
      responses:
        "200":
          description: One page of storages
          content:
