              schema:
                $ref: "#/components/schemas/StorageTestResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /storages/{storageId}/transfer:
    parameters:
      - $ref: "#/components/parameters/StorageId"
    post:
      operationId: transferStorage
      tags: [storages]
      summary: Move a storage to another workspace
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in both workspaces. While the backup config of
        a database outside the target workspace uses the storage, the answer is 409 `in_use`, and
        the storage stays.
      requestBody:
        description: The workspace the storage moves to.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTransfer"
      responses:
        "204":
          description: The storage belongs to the target workspace
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /storage-tests:
    post:
      operationId: testStorageSettings
      tags: [storages]
      summary: Test the connection with settings that are not saved
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in the workspace, because a test connects
        wherever the request points; rclone settings need an instance admin. With `storageId`, a
        secret the request leaves out is taken from that storage, which must belong to the same
        workspace, or the answer is 404 `not_found`; settings of another type or another prefix than
        that storage's get 400 `invalid_request`. With another resource address than the storage's, a
        secret the settings use must be sent again or the answer is 400 `invalid_request`, as in
        `updateStorage`. Nothing leaves the backend on a
        refusal, and nothing is saved. SFTP uses only credentials selected by `authMethods`, with the
        same retained-secret fallback and validation as saving.
      requestBody:
        description: The settings to test.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageSettingsTest"
      responses:
        "200":
          description: Whether the storage could be reached and written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTestResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /system/health:
