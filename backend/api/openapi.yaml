openapi: 3.0.3
info:
  title: Databasus API
  version: 1.0.0
  description: >-
    The API of a Databasus instance. The web interface and users' own scripts call it. Every error
    answers with a `Problem` body whose `code` tells the cause apart.
servers:
  - url: /api/v1
security:
  - sessionToken: []
tags:
  - name: system
    description: The running Databasus instance itself
  - name: users
    description: Users, sign-in, password reset and the instance settings
  - name: workspaces
    description: Workspaces, their members, the ownership of a workspace and the audit log views
  - name: notifiers
    description: The notification channels of a workspace and their test sends
  - name: storages
    description: The places a workspace keeps its backups, and their connection tests
  - name: databases
    description: The databases a workspace backs up, their connection tests and limited users
  - name: backups
    description: How each database is backed up, and the move of a database to another workspace
  - name: verification
    description: Backup verifications, their agents and automatic verification settings
  - name: healthcheck
    description: Scheduled database availability checks, settings and attempt history
paths:
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List the users of the instance
      description: >-
        The newest users come first. `query` keeps the users whose email address or name contains
        it, ignoring case.
      x-access: admin
      parameters:
        - name: limit
          in: query
          description: The largest number of users on the page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
        - name: query
          in: query
          description: The text the email address or the name contains
          schema:
            type: string
      responses:
        "200":
          description: One page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: signUp
      tags: [users]
      summary: Sign up and sign in as the new user
      description: >-
        Public, because it creates the user and the session the caller does not have yet. The
        first user of an instance administers it, even when registration is closed. An invited
        user finishes sign-up through it.
      x-access: public
      security: []
      requestBody:
        description: The new account and the answer to the human-verification challenge.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: The user exists and is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      description: >-
        A user reads their own user; an instance admin reads any user. Anyone else gets 403
        `permission_denied`.
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateUser
      tags: [users]
      summary: Replace the name and the email address of the signed-in user
      description: >-
        Only the user's own ID is accepted; any other gets 403 `permission_denied`. A new address
        must be a valid email address that no other user holds, or the answer is 400
        `invalid_request` or 409 `email_taken`. The current session survives the change, and the
        next sign-in uses the new address.
      requestBody:
        description: The name and the email address the user keeps after the change.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{userId}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: changeUserPassword
      tags: [users]
      summary: Replace the password of the signed-in user
      description: >-
        Only the user's own ID is accepted; any other gets 403 `permission_denied`. Every session
        issued before the change stops working, the caller's own included, so the client signs in
        again with the new password.
      requestBody:
        description: The new password.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: The password is changed
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{userId}/activate:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: activateUser
      tags: [users]
      summary: Activate a user
      description: >-
        The user signs in again. Only the bootstrap administrator activates an instance admin; anyone else gets 403 `permission_denied`.
      x-access: admin
      responses:
        "200":
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{userId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: deactivateUser
      tags: [users]
      summary: Deactivate a user
      description: >-
        Every session of the user stops working, and sign-in answers `user_deactivated`. Deactivating yourself or the bootstrap administrator gets 403 `permission_denied`, and so does deactivating an instance admin for anyone but the bootstrap administrator.
      x-access: admin
      responses:
        "200":
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{userId}/role:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: changeUserRole
      tags: [users]
      summary: Replace the global role of a user
      description: >-
        Only the bootstrap administrator grants or revokes the admin role; anyone else gets 403
        `permission_denied`. Nobody changes their own role or the role of the bootstrap
        administrator.
      x-access: admin
      requestBody:
        description: The new role.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleChange"
      responses:
        "200":
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sessions:
    post:
      operationId: signIn
      tags: [users]
      summary: Sign in with an email address and a password
      description: >-
        Public, because it creates the session the caller does not have yet. A wrong password, an
        unknown address, a user who has not finished sign-up and a user without a password all get
        401 `invalid_credentials`. A deactivated user gets 403 `user_deactivated` only after the
        correct password. When the instance requires the second factor, the answer names a
        pending sign-in and the code goes to the user's address.
      x-access: public
      security: []
      requestBody:
        description: The credentials and the answer to the human-verification challenge.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: The session, or the pending sign-in that waits for the emailed code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInOutcome"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /github-sessions:
    post:
      operationId: signInWithGitHub
      tags: [users]
      summary: Sign in with GitHub
      description: >-
        Public, because it creates the session the caller does not have yet. The code from GitHub's
        authorization page signs in the user linked to the GitHub account, or the user with the same
        email address, linking the account and finishing the sign-up of an invited user. An unknown
        address creates a user under the same rules as sign-up. The second factor does not apply,
        because GitHub verified the user. A deactivated user gets 403 `user_deactivated`, an instance
        without the GitHub client gets 409 `oauth_not_configured`, and a code GitHub refuses or an
        account without an email address gets 400 `oauth_failed`.
      x-access: public
      security: []
      requestBody:
        description: The authorization code and the redirect URI it was issued for.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthSignInRequest"
      responses:
        "200":
          description: The user is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /google-sessions:
    post:
      operationId: signInWithGoogle
      tags: [users]
      summary: Sign in with Google
      description: >-
        Public, because it creates the session the caller does not have yet. The code from Google's
        authorization page signs in the user linked to the Google account, or the user with the same
        email address, linking the account and finishing the sign-up of an invited user. An unknown
        address creates a user under the same rules as sign-up. The second factor does not apply,
        because Google verified the user. A deactivated user gets 403 `user_deactivated`, an instance
        without the Google client gets 409 `oauth_not_configured`, and a code Google refuses or an
        account without an email address gets 400 `oauth_failed`.
      x-access: public
      security: []
      requestBody:
        description: The authorization code and the redirect URI it was issued for.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthSignInRequest"
      responses:
        "200":
          description: The user is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /password-resets:
    post:
      operationId: requestPasswordReset
      tags: [users]
      summary: Mail a password reset code
      description: >-
        Public, because the caller cannot sign in. The answer is the same for an active user, a
        user who is not active and an address without a user; only an active user gets a code, valid
        for an hour. Three requests an hour per address, whether a user holds it or not.
      x-access: public
      security: []
      requestBody:
        description: The address and the answer to the human-verification challenge.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: The request is accepted
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /password-reset-completions:
    post:
      operationId: completePasswordReset
      tags: [users]
      summary: Replace the password with a mailed reset code
      description: >-
        Public, because the caller cannot sign in. Only the newest code of a user works, and it
        accepts five attempts. A wrong, used, expired, exhausted or older code and an address without
        an active user all get 400 `invalid_reset_code`. Every session issued before the reset stops
        working.
      x-access: public
      security: []
      requestBody:
        description: The address, the code from the email and the new password.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompletion"
      responses:
        "204":
          description: The password is replaced
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /instance-settings:
    get:
      operationId: getInstanceSettings
      tags: [users]
      summary: Get the instance settings
      description: >-
        Every signed-in user reads them, because the interface offers registration, invitations and
        new workspaces by them. `isEmailConfigured` is the instance's own judgement about its mail
        server.
      responses:
        "200":
          description: The instance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateInstanceSettings
      tags: [users]
      summary: Replace the instance settings
      description: >-
        Turning the second factor on is refused with 409 `email_not_configured` when the instance
        has no mail server, and with 409 `admin_email_missing` naming the administrator when an
        active administrator has no valid email address. Turning it off is never refused.
      x-access: admin
      requestBody:
        description: Every instance setting; settings left as they were stay unchanged.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceSettingsUpdate"
      responses:
        "200":
          description: The instance settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /test-emails:
    post:
      operationId: sendTestEmail
      tags: [users]
      summary: Send a test email to the signed-in administrator
      description: >-
        Refused with 409 `email_not_configured` without a mail server and with 409
        `admin_email_missing` when the administrator has no valid email address. A message the mail
        server refuses is still a test that ran: the answer says it was not delivered and carries
        the mail server's response. Five per administrator in ten minutes.
      x-access: admin
      responses:
        "201":
          description: The test email that was attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pending-sign-ins/{pendingSignInId}/verify:
    parameters:
      - $ref: "#/components/parameters/PendingSignInId"
    post:
      operationId: verifySignInCode
      tags: [users]
      summary: Complete a pending sign-in with the emailed code
      description: >-
        Public, because it creates the session the caller does not have yet. A pending sign-in
        expires ten minutes after its code was sent and is destroyed by the fifth wrong code; then
        it answers 410 `pending_sign_in_not_usable`. Ten attempts a minute per pending sign-in.
      x-access: public
      security: []
      requestBody:
        description: The code from the email and the answer to the human-verification challenge.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySignInCodeRequest"
      responses:
        "200":
          description: The user is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pending-sign-ins/{pendingSignInId}/resend:
    parameters:
      - $ref: "#/components/parameters/PendingSignInId"
    post:
      operationId: resendSignInCode
      tags: [users]
      summary: Send a new code that replaces the pending sign-in
      description: >-
        Public, because the caller is still signing in. The answer names the new pending sign-in,
        and the previous code stops working. One resend a minute and five codes an hour per user.
      x-access: public
      security: []
      requestBody:
        description: The answer to the human-verification challenge.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendSignInCodeRequest"
      responses:
        "200":
          description: The pending sign-in that the new code completes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingSignIn"
        "400":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sign-in-options:
    get:
      operationId: getSignInOptions
      tags: [users]
      summary: Get what the sign-in page offers
      description: >-
        Public, because the sign-in page reads it before anyone signs in. It tells whether the
        instance has a user yet, so the page offers the registration that claims the instance.
      x-access: public
      security: []
      responses:
        "200":
          description: The options of the sign-in page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInOptions"
        default:
          $ref: "#/components/responses/Problem"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List the workspaces of the signed-in user
      description: >-
        Ordered by name, then by ID. A user sees the workspaces they are a member of; an instance
        admin sees every workspace, with no `currentUserRole` in the ones they are not a member of.
      parameters:
        - name: limit
          in: query
          description: The largest number of workspaces on the page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
      responses:
        "200":
          description: One page of workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace owned by the signed-in user
      description: >-
        An instance admin may always create one. Anyone else may only while the instance settings
        let members create workspaces, and otherwise gets 403 `permission_denied`.
      requestBody:
        description: The workspace to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: The workspace, with the creator as its owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Get a workspace
      description: >-
        A user who is not a member of the workspace gets 404 `not_found`, as for a workspace that
        does not exist.
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Replace the name of a workspace
      description: >-
        Needs the role `WORKSPACE_ADMIN` or `WORKSPACE_OWNER`; a viewer or a member gets 403
        `permission_denied`.
      requestBody:
        description: The editable fields of the workspace.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: The workspace after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      summary: Delete a workspace with its notifiers, storages and members
      description: >-
        Needs the role `WORKSPACE_OWNER`. A workspace that still has databases gets 409
        `workspace_not_empty`. Retained storage references take priority over cleanup and get 409 `in_use`.
        Otherwise outstanding file cleanup on any affected storage gets 409 `cleanup_pending`;
        wait for cleanup or explicitly delete those storages individually. No bulk abandonment is
        available. Outsiders get 404 `not_found`, insufficient roles get 403 `permission_denied`.
        Instance admins retain workspace access. The deletion happens completely or not at all.
      responses:
        "204":
          description: The workspace is deleted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /workspaces/{workspaceId}/transfer-ownership:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: transferWorkspaceOwnership
      tags: [workspaces]
      summary: Make another member the owner of a workspace
      description: >-
        Needs the role `WORKSPACE_OWNER`. The previous owner becomes `WORKSPACE_ADMIN`. A member of
        another workspace gets 404 `not_found`, and naming the current owner changes nothing.
      requestBody:
        description: The member who becomes the owner.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnershipTransfer"
      responses:
        "204":
          description: The named member owns the workspace
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /workspace-members:
    get:
      operationId: listWorkspaceMembers
      tags: [workspaces]
      summary: List the members of a workspace
      description: >-
        Ordered by the time a member joined, the oldest first, then by ID. A user who is not a
        member of the workspace gets 404 `not_found`.
      parameters:
        - name: workspaceId
          in: query
          required: true
          description: The workspace whose members to list
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
