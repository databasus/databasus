          type: string
          description: The `after` of the next page, absent on the last page
    LogicalBackupStart:
      type: object
      description: The database whose backup to start
      required: [databaseId]
      properties:
        databaseId:
          type: string
          format: uuid
          description: The database to back up
    DownloadTokenCreate:
      type: object
      description: The backup whose file to download
      required: [backupId]
      properties:
        backupId:
          type: string
          format: uuid
          description: The backup to download
    DownloadToken:
      type: object
      description: A single-use token that downloads one backup file within five minutes
      required: [token, fileName, expiresAt]
      properties:
        token:
          type: string
          description: The token, returned only in this response
        fileName:
          type: string
          description: The name the downloaded file gets
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working
    RestoreStatus:
      type: string
      description: Where a restore is in its life
      enum: [IN_PROGRESS, COMPLETED, FAILED, CANCELED]
    Restore:
      type: object
      description: One restore of a logical backup, without any field of its target
      required: [id, backupId, status, durationMs, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the restore
        backupId:
          type: string
          format: uuid
          description: The backup the restore reads
        status:
          $ref: "#/components/schemas/RestoreStatus"
        failMessage:
          type: string
          description: Why the restore failed, absent unless it failed
        durationMs:
          type: integer
          format: int64
          description: How long the restore ran in milliseconds
        createdAt:
          type: string
          format: date-time
          description: When the restore started
    RestorePage:
      type: object
      description: One page of restores, newest first
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Restore"
          description: The restores on the page
        nextCursor:
          type: string
          description: The `after` of the next page, absent on the last page
    RestoreStart:
      type: object
      description: The backup to restore and the database to restore it into
      required: [backupId, target]
      properties:
        backupId:
          type: string
          format: uuid
          description: The completed backup to restore
        target:
          $ref: "#/components/schemas/RestoreTarget"
    RestoreTarget:
      description: >-
        The database a restore writes into, of the backup's engine; `type` takes the database type
        of the backup's database
      oneOf:
        - $ref: "#/components/schemas/PostgresqlRestoreTarget"
        - $ref: "#/components/schemas/MysqlRestoreTarget"
        - $ref: "#/components/schemas/MariadbRestoreTarget"
        - $ref: "#/components/schemas/MongodbRestoreTarget"
      discriminator:
        propertyName: type
        mapping:
          POSTGRES_LOGICAL: "#/components/schemas/PostgresqlRestoreTarget"
          MYSQL: "#/components/schemas/MysqlRestoreTarget"
          MARIADB: "#/components/schemas/MariadbRestoreTarget"
          MONGODB: "#/components/schemas/MongodbRestoreTarget"
    PostgresqlRestoreTarget:
      type: object
      description: A PostgreSQL database that pg_restore writes into
      required:
        - type
        - host
        - port
        - username
        - password
        - database
        - sslMode
        - sshTunnel
        - cpuCount
        - isExcludeExtensions
        - isRestoreOwnership
        - isRestorePrivileges
      properties:
        type:
          type: string
          enum: [POSTGRES_LOGICAL]
          description: Always `POSTGRES_LOGICAL`
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        database:
          type: string
          minLength: 1
          description: The database the restore writes into
        sslMode:
          $ref: "#/components/schemas/PostgresqlSslMode"
        sslClientCert:
          type: string
          description: The PEM client certificate, absent without one
        sslClientKey:
          type: string
          writeOnly: true
          description: The PEM key of the client certificate
        sslRootCert:
          type: string
          description: The PEM root certificate the server is verified against, absent without one
        sshTunnel:
          $ref: "#/components/schemas/SshTunnelSettings"
        cpuCount:
          type: integer
          minimum: 1
          description: The number of parallel jobs of pg_restore; more than one restores through a file
        isExcludeExtensions:
          type: boolean
          description: Whether the restore leaves out the extensions, which needs a file
        isRestoreOwnership:
          type: boolean
          description: Whether the restore keeps the owners of the objects
        isRestorePrivileges:
          type: boolean
          description: Whether the restore keeps the grants of the objects
    MysqlRestoreTarget:
      type: object
      description: A MySQL database the dump is replayed into
      required: [type, host, port, username, password, database, isHttps, sshTunnel]
      properties:
        type:
          type: string
          enum: [MYSQL]
          description: Always `MYSQL`
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        database:
          type: string
          minLength: 1
          description: The database the restore writes into
        isHttps:
          type: boolean
          description: Whether the connection is encrypted, without verifying the server certificate
        sshTunnel:
          $ref: "#/components/schemas/SshTunnelSettings"
    MariadbRestoreTarget:
      type: object
      description: A MariaDB database the dump is replayed into
      required: [type, host, port, username, password, database, isHttps, sshTunnel, isSkipGaleraDisable]
      properties:
        type:
          type: string
          enum: [MARIADB]
          description: Always `MARIADB`
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        database:
          type: string
          minLength: 1
          description: The database the restore writes into
        isHttps:
          type: boolean
          description: Whether the connection is encrypted, without verifying the server certificate
        sshTunnel:
          $ref: "#/components/schemas/SshTunnelSettings"
        isSkipGaleraDisable:
          type: boolean
          description: Whether the restore keeps Galera replication on for its session
    MongodbRestoreTarget:
      type: object
      description: A MongoDB database that mongorestore writes into
      required:
        - type
        - host
        - username
        - password
        - database
        - authDatabase
        - isHttps
        - isSrv
        - isDirectConnection
        - sshTunnel
        - cpuCount
      properties:
        type:
          type: string
          enum: [MONGODB]
          description: Always `MONGODB`
        host:
          type: string
          description: The host of the server, or the DNS name of an SRV connection
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server, absent for an SRV connection
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        database:
          type: string
          minLength: 1
          description: The database the restore writes into
        authDatabase:
          type: string
          description: The database the user authenticates against
        isHttps:
          type: boolean
          description: Whether TLS is on, without verifying the server certificate
        isSrv:
          type: boolean
          description: Whether the host is resolved through DNS SRV records
        isDirectConnection:
          type: boolean
          description: Whether the client talks to the host alone instead of discovering the replica set
        sshTunnel:
          $ref: "#/components/schemas/SshTunnelSettings"
        cpuCount:
          type: integer
          minimum: 1
          description: The number of collections mongorestore writes at once
