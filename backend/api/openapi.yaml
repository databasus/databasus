      responses:
        "204":
          description: The notifier belongs to the target workspace
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /notifier-tests:
    post:
      operationId: testNotifierSettings
      tags: [notifiers]
      summary: Send a test message with settings that are not saved
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in the workspace, because a test sends to
        wherever the request points. With `notifierId`, a secret the request leaves out is taken from
