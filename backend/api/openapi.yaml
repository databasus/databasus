        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createStorage
      tags: [storages]
      summary: Create a storage in a workspace
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher in the workspace; rclone settings need an
        instance admin. The type in `settings` is fixed once the storage exists. Settings the
        provider refuses get 400 `invalid_request` with the field in `errors`.
      requestBody:
        description: The storage to create, with every secret its provider needs.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageCreate"
      responses:
        "201":
          description: The storage as it was saved, without its secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /storages/{storageId}:
    parameters:
      - $ref: "#/components/parameters/StorageId"
    get:
      operationId: getStorage
      tags: [storages]
      summary: Get a storage without its secrets
      description: >-
        A user who is not a member of the storage's workspace gets 404 `not_found`, as for a
        storage that does not exist.
      responses:
        "200":
          description: The storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateStorage
      tags: [storages]
      summary: Replace the name and the settings of a storage
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher; an rclone storage needs an instance admin. A
        secret the request leaves out keeps its stored value while the storage's resource address
        stays the stored one: the S3 endpoint, the Azure Blob endpoint and account name, or the host
        and port of FTP, NAS and SFTP. With another resource address, a secret the settings use must
        be sent again or the answer is 400 `invalid_request` with a field error, and a secret they no
        longer use is removed. SFTP retains only secrets selected by `authMethods` and removes
        excluded credentials. Settings of another type than the
        storage's, or an S3 or Azure Blob prefix other than the stored one, get 400
        `invalid_request`, because both are fixed when the storage is created.
      requestBody:
        description: The editable fields of the storage.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUpdate"
      responses:
        "200":
          description: The storage after the change, without its secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteStorage
      tags: [storages]
      summary: Delete a storage
      description: >-
        Needs the role `WORKSPACE_MEMBER` or higher. A storage that a backup config uses or that
        still holds backups gets 409 `in_use`, even with explicit abandonment. Otherwise pending file
        cleanup returns 409 `cleanup_pending` unless shouldAbandonCleanup is true. Explicit
        abandonment atomically removes the storage and its queue, recording a bounded audit snapshot.
        This request never contacts the provider or deletes its bucket or directory. Outsiders get
        404 `not_found`, viewers get 403 `permission_denied`; instance admins retain workspace access.
      parameters:
        - name: shouldAbandonCleanup
          in: query
          description: Explicitly abandon all outstanding automatic file cleanup for this storage
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: The storage is deleted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
