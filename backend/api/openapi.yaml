          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: The ID of the user
      schema:
        type: string
        format: uuid
    PendingSignInId:
      name: pendingSignInId
      in: path
      required: true
      description: The pending sign-in that the latest password step or resend named
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The ID of the workspace
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      description: The ID of the member, which names one user in one workspace
      schema:
        type: string
        format: uuid
    NotifierId:
      name: notifierId
      in: path
      required: true
      description: The ID of the notifier
      schema:
        type: string
        format: uuid
    StorageId:
      name: storageId
      in: path
      required: true
      description: The ID of the storage
      schema:
        type: string
        format: uuid
    DatabaseId:
      name: databaseId
      in: path
      required: true
      description: The ID of the database
      schema:
        type: string
        format: uuid
    BackupConfigDatabaseId:
      name: databaseId
      in: path
      required: true
      description: >-
        The ID of the database the config belongs to. A database has exactly one config, which has no
        ID of its own, so the database's ID is the key of the config.
      schema:
        type: string
        format: uuid
    PhysicalBackupId:
      name: backupId
      in: path
      required: true
      description: The ID of a full or incremental physical backup
      schema:
        type: string
        format: uuid
    BackupId:
      name: backupId
      in: path
      required: true
      description: The ID of the logical backup
      schema:
        type: string
        format: uuid
    RestoreId:
      name: restoreId
      in: path
      required: true
      description: The ID of the restore
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The session token that a sign-in operation returns. An operation without `x-access: public`
        answers 401 `unauthenticated` without a valid one.
  responses:
    Problem:
      description: An error in the RFC 9457 format
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthcheckConfigInput:
      description: All editable settings for scheduled availability checks
      type: object
      required: [isHealthcheckEnabled, isNotificationEnabled, intervalMinutes, failedAttemptsBeforeUnavailable, attemptRetentionDays]
      properties:
        isHealthcheckEnabled:
          type: boolean
          description: Whether scheduled availability checks are enabled
        isNotificationEnabled:
          type: boolean
          description: Whether status changes send notifications
        intervalMinutes:
          type: integer
          description: The interval between availability checks in minutes
          minimum: 1
        failedAttemptsBeforeUnavailable:
          type: integer
          description: Consecutive failed attempts needed to mark the database unavailable
          minimum: 1
        attemptRetentionDays:
          type: integer
          description: How many days of attempts to keep
          minimum: 1
    HealthcheckConfig:
      description: The saved availability check settings of a database
      type: object
      required: [databaseId, isHealthcheckEnabled, isNotificationEnabled, intervalMinutes, failedAttemptsBeforeUnavailable, attemptRetentionDays]
      properties:
        databaseId:
          type: string
          format: uuid
          description: The database these settings belong to
        isHealthcheckEnabled:
          type: boolean
          description: Whether scheduled availability checks are enabled
        isNotificationEnabled:
          type: boolean
          description: Whether status changes send notifications
        intervalMinutes:
          type: integer
          description: The interval between availability checks in minutes
          minimum: 1
        failedAttemptsBeforeUnavailable:
          type: integer
          description: Consecutive failed attempts needed to mark the database unavailable
          minimum: 1
        attemptRetentionDays:
          type: integer
          description: How many days of attempts to keep
          minimum: 1
    HealthcheckAttempt:
      description: One recorded availability check
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the recorded check
        status:
          $ref: "#/components/schemas/DatabaseHealthStatus"
        createdAt:
          type: string
          format: date-time
          description: The time of this check in UTC
    HealthcheckAttemptPage:
      description: A bounded page of attempts ordered newest first
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HealthcheckAttempt"
        nextCursor:
          type: string
          description: Continue after this cursor; absent on the last page
    VerificationAgentCount:
      description: Verification Agent Count
      type: object
      required: [agentCount]
      properties:
        agentCount:
          type: integer
          format: int64
          minimum: 0
    VerificationAgentInput:
      description: Verification Agent Input
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    VerificationAgent:
      description: Verification Agent
      type: object
      required: [id, name, maxCpu, maxRamMb, maxDiskGb, maxConcurrentJobs, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        maxCpu:
          type: integer
        maxRamMb:
          type: integer
        maxDiskGb:
          type: integer
        maxConcurrentJobs:
          type: integer
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreatedVerificationAgent:
      description: Created Verification Agent
      type: object
      required: [agent, token]
      properties:
        agent:
          $ref: "#/components/schemas/VerificationAgent"
        token:
          type: string
    VerificationAgentToken:
      description: Verification Agent Token
      type: object
      required: [token]
      properties:
        token:
          type: string
    VerificationScheduleType:
      description: Verification Schedule Type
      type: string
      enum: [INTERVAL, AFTER_BACKUP]
    VerificationNotificationTrigger:
      description: Verification Notification Trigger
      type: string
      enum: [VERIFICATION_SUCCESS, VERIFICATION_FAILED]
    VerificationTrigger:
      description: Verification Trigger
      type: string
      enum: [MANUAL, SCHEDULED, AFTER_BACKUP]
    VerificationStatus:
      description: Verification Status
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELED]
    VerificationConfigInput:
      description: Verification Config Input
      type: object
      required: [isAutomaticVerificationEnabled, scheduleType, schedule, notificationTriggers]
      properties:
        isAutomaticVerificationEnabled:
          type: boolean
        scheduleType:
          $ref: "#/components/schemas/VerificationScheduleType"
        schedule:
          $ref: "#/components/schemas/Schedule"
        notificationTriggers:
          type: array
          items:
            $ref: "#/components/schemas/VerificationNotificationTrigger"
    VerificationConfig:
      description: Verification Config
      type: object
      required: [databaseId, isAutomaticVerificationEnabled, scheduleType, schedule, notificationTriggers]
      properties:
        databaseId:
          type: string
          format: uuid
        isAutomaticVerificationEnabled:
          type: boolean
        scheduleType:
          $ref: "#/components/schemas/VerificationScheduleType"
        schedule:
          $ref: "#/components/schemas/Schedule"
        notificationTriggers:
          type: array
          items:
            $ref: "#/components/schemas/VerificationNotificationTrigger"
    StartVerificationInput:
      description: Start Verification Input
      type: object
      required: [backupId]
      properties:
        backupId:
          type: string
          format: uuid
    Verification:
      description: Verification
      type: object
      required: [id, databaseId, backupId, trigger, status, attemptCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        databaseId:
          type: string
          format: uuid
        backupId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        trigger:
          $ref: "#/components/schemas/VerificationTrigger"
        status:
          $ref: "#/components/schemas/VerificationStatus"
        attemptCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        restoreDurationMs:
          type: integer
          format: int64
        verifyDurationMs:
          type: integer
          format: int64
        pgRestoreExitCode:
          type: integer
        restoredDatabaseSizeBytes:
          type: integer
          format: int64
        tableCount:
          type: integer
        schemaCount:
          type: integer
        failMessage:
          type: string
    VerificationTableStat:
      description: Verification Table Stat
      type: object
      required: [schemaName, name, rowCount]
      properties:
        schemaName:
          type: string
        name:
          type: string
        rowCount:
          type: integer
          format: int64
    VerificationDetails:
      description: Verification Details
      allOf:
        - $ref: "#/components/schemas/Verification"
        - type: object
          required: [tableStats]
          properties:
            tableStats:
              type: array
              items:
                $ref: "#/components/schemas/VerificationTableStat"
    VerificationAgentPage:
      description: Verification Agent Page
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VerificationAgent"
        nextCursor:
          type: string
    VerificationPage:
      description: Verification Page
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Verification"
        nextCursor:
          type: string
    SignUpRequest:
      type: object
      description: The user to create
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          description: The address the user signs in with
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: The password, at least 8 characters
        name:
          type: string
          minLength: 1
          description: The name other users see
        cloudflareTurnstileToken:
          type: string
          description: The answer to the human-verification challenge, required when the instance has one
    SignInRequest:
      type: object
      description: The credentials of a password sign-in
      required: [email, password]
      properties:
        email:
          type: string
          description: The address the user signs in with
        password:
          type: string
          writeOnly: true
          description: The password
        cloudflareTurnstileToken:
          type: string
          description: The answer to the human-verification challenge, required when the instance has one
    Session:
      type: object
      description: >-
        A session of a signed-in user. The operation that creates it returns the token once; no
        other operation returns it
      required: [userId, email, token]
      properties:
        userId:
          type: string
          format: uuid
          description: The ID of the signed-in user
        email:
          type: string
          description: The address of the signed-in user
        token:
          type: string
          description: "The session token to send as `Authorization: Bearer <token>`"
    OAuthSignInRequest:
      type: object
      description: The answer of an identity provider's authorization page
      required: [code, redirectUri]
      properties:
        code:
          type: string
          minLength: 1
          description: The authorization code the provider issued
        redirectUri:
          type: string
          minLength: 1
          description: The redirect URI the code was issued for
    SignInOutcome:
      description: The session, or the pending sign-in that waits for the emailed code
      oneOf:
        - $ref: "#/components/schemas/SignInCompleted"
        - $ref: "#/components/schemas/SignInCodeRequired"
      discriminator:
        propertyName: outcome
        mapping:
          COMPLETED: "#/components/schemas/SignInCompleted"
          CODE_REQUIRED: "#/components/schemas/SignInCodeRequired"
    SignInCompleted:
      type: object
      description: The user is signed in
      required: [outcome, userId, email, token]
      properties:
        outcome:
          type: string
          enum: [COMPLETED]
          description: Always `COMPLETED`
        userId:
          type: string
          format: uuid
          description: The ID of the signed-in user
        email:
          type: string
          description: The address of the signed-in user
        token:
          type: string
          description: "The session token to send as `Authorization: Bearer <token>`, returned once"
    SignInCodeRequired:
      type: object
      description: The password was correct, and a code went to the user's address
      required: [outcome, pendingSignInId, email]
      properties:
        outcome:
          type: string
          enum: [CODE_REQUIRED]
          description: Always `CODE_REQUIRED`
        pendingSignInId:
          type: string
          format: uuid
          description: The pending sign-in that the code completes
        email:
          type: string
          description: The address the code went to
    VerifySignInCodeRequest:
      type: object
      description: The code emailed for a pending sign-in
      required: [code]
      properties:
        code:
          type: string
          writeOnly: true
          description: The six digits from the message
        cloudflareTurnstileToken:
          type: string
          description: The answer to the human-verification challenge, required when the instance has one
    ResendSignInCodeRequest:
      type: object
      description: A request for a new code
      properties:
        cloudflareTurnstileToken:
          type: string
          description: The answer to the human-verification challenge, required when the instance has one
    PendingSignIn:
      type: object
      description: A password sign-in that waits for the emailed code
      required: [pendingSignInId, email]
      properties:
        pendingSignInId:
          type: string
          format: uuid
          description: The pending sign-in that the code completes
        email:
          type: string
          description: The address the code went to
    SignInOptions:
      type: object
      description: What the sign-in page offers
      required: [hasAnyUser]
      properties:
        hasAnyUser:
          type: boolean
          description: Whether the instance has a user; without one the page offers the first registration
    User:
      type: object
      description: A user of the instance
      required: [id, email, name, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the user
        email:
          type: string
          description: The address the user signs in with
        name:
          type: string
          description: The name other users see
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt:
          type: string
          format: date-time
          description: When the user was created
    PasswordResetRequest:
      type: object
      description: A request for a password reset code
      required: [email]
      properties:
        email:
          type: string
          description: The address the user signs in with
        cloudflareTurnstileToken:
          type: string
          description: The answer to the human-verification challenge, required when the instance has one
    PasswordResetCompletion:
      type: object
      description: A mailed reset code and the password that replaces the old one
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          description: The address the code was sent to
        code:
          type: string
          description: The code from the email
        newPassword:
          type: string
          writeOnly: true
          minLength: 8
          description: The new password, at least 8 characters
    UserPage:
      type: object
      description: One page of users, the newest first
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
          description: The users on the page
        nextCursor:
          type: string
          description: The `after` of the next page, absent on the last page
    UserRoleChange:
      type: object
      description: A new global role
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
    UserUpdate:
      type: object
      description: The editable fields of a user
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          description: The name other users see
        email:
          type: string
          description: The address the user signs in with
    PasswordChange:
      type: object
      description: A new password
      required: [newPassword]
      properties:
        newPassword:
          type: string
          writeOnly: true
          minLength: 8
          description: The new password, at least 8 characters
    UserRole:
      type: string
      description: The global role; an instance admin administers the instance
      enum: [ADMIN, MEMBER]
    UserStatus:
      type: string
      description: >-
        `INVITED` for a user who was invited and has not finished sign-up, `ACTIVE`, or `INACTIVE`
        for a deactivated user
      enum: [INVITED, ACTIVE, INACTIVE]
    InstanceSettings:
      type: object
      description: The settings of the instance
      required:
        - isAllowExternalRegistrations
        - isAllowMemberInvitations
        - isMemberAllowedToCreateWorkspaces
        - isTwoFactorAuthRequired
        - isEmailConfigured
      properties:
        isAllowExternalRegistrations:
          type: boolean
          description: Anyone may sign up without an invitation
        isAllowMemberInvitations:
          type: boolean
          description: A user who is not an instance admin may invite users
        isMemberAllowedToCreateWorkspaces:
          type: boolean
          description: A user who is not an instance admin may create workspaces
        isTwoFactorAuthRequired:
          type: boolean
          description: A password sign-in also needs a code emailed to the user
        isEmailConfigured:
          type: boolean
          description: Whether the operator configured a mail server; it cannot be changed here
    InstanceSettingsUpdate:
      type: object
      description: The editable instance settings
      required:
        - isAllowExternalRegistrations
        - isAllowMemberInvitations
        - isMemberAllowedToCreateWorkspaces
        - isTwoFactorAuthRequired
      properties:
        isAllowExternalRegistrations:
          type: boolean
          description: Anyone may sign up without an invitation
        isAllowMemberInvitations:
          type: boolean
          description: A user who is not an instance admin may invite users
        isMemberAllowedToCreateWorkspaces:
          type: boolean
          description: A user who is not an instance admin may create workspaces
        isTwoFactorAuthRequired:
          type: boolean
          description: A password sign-in also needs a code emailed to the user
    TestEmail:
      type: object
      description: A test email the instance tried to deliver
      required: [recipientEmail, isDelivered]
      properties:
        recipientEmail:
          type: string
          description: The address of the administrator the message went to
        isDelivered:
          type: boolean
          description: Whether the mail server accepted the message
        failureDetail:
          type: string
          description: The error of the delivery with the mail server's response, present when it failed
    VersionResponse:
      type: object
      description: The body of the version operation
      required: [version]
      properties:
        version:
          type: string
          description: The version of the running instance, such as `3.26.0`
    Workspace:
      type: object
      description: A workspace
      required: [id, name, createdAt, currentUserRole]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the workspace
        name:
          type: string
          description: The name of the workspace
        createdAt:
          type: string
          format: date-time
          description: When the workspace was created
        currentUserRole:
          allOf:
            - $ref: "#/components/schemas/WorkspaceRole"
          nullable: true
          description: >-
            The role of the signed-in user in the workspace, null for an instance admin who is not
            a member of it
    WorkspacePage:
      type: object
      description: One page of workspaces, ordered by name
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
          description: The workspaces on the page
        nextCursor:
          type: string
          description: The `after` of the next page, absent on the last page
    WorkspaceCreate:
      type: object
      description: A new workspace
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the workspace
    WorkspaceUpdate:
      type: object
      description: The editable fields of a workspace
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the workspace
    OwnershipTransfer:
      type: object
      description: The member who becomes the owner of the workspace
      required: [newOwnerMemberId]
      properties:
        newOwnerMemberId:
          type: string
          format: uuid
          description: The member ID of the new owner, a member of the same workspace
    WorkspaceMember:
      type: object
      description: A user in a workspace
      required: [id, workspaceId, userId, email, name, role, isInvited, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: The member ID
        workspaceId:
          type: string
          format: uuid
          description: The workspace the member belongs to
        userId:
          type: string
          format: uuid
          description: The user of the member
        email:
          type: string
          description: The address the user signs in with
        name:
          type: string
          description: The name of the user
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        isInvited:
          type: boolean
          description: Whether the user was invited and has not finished sign-up
        createdAt:
          type: string
          format: date-time
          description: When the user joined the workspace
    WorkspaceMemberPage:
      type: object
      description: One page of members, the oldest first
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMember"
          description: The members on the page
        nextCursor:
          type: string
          description: The `after` of the next page, absent on the last page
    WorkspaceMemberAddition:
      type: object
      description: A user to add to a workspace
      required: [workspaceId, email, role]
      properties:
        workspaceId:
          type: string
          format: uuid
          description: The workspace to add the user to
        email:
          type: string
          format: email
          description: The address of the user; an address without a user invites one
        role:
          $ref: "#/components/schemas/AssignableWorkspaceRole"
    AddedWorkspaceMember:
      description: The new member and whether the user was added or invited
      allOf:
        - $ref: "#/components/schemas/WorkspaceMember"
        - type: object
          required: [outcome]
          properties:
            outcome:
              type: string
              enum: [ADDED, INVITED]
              description: >-
                `ADDED` for a user who already had an account, `INVITED` for an address that got
                an invited user
    WorkspaceMemberRoleChange:
      type: object
      description: A new workspace role
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/AssignableWorkspaceRole"
    WorkspaceRole:
      type: string
      description: >-
        The role of a member in a workspace. A viewer sees it, a member also edits its content, an
        admin also renames it and manages members, and the owner also manages admins, transfers
        ownership and deletes it
      enum: [WORKSPACE_OWNER, WORKSPACE_ADMIN, WORKSPACE_MEMBER, WORKSPACE_VIEWER]
    AssignableWorkspaceRole:
      type: string
      description: A workspace role a request may set; the owner role changes hands only through a transfer
      enum: [WORKSPACE_ADMIN, WORKSPACE_MEMBER, WORKSPACE_VIEWER]
    AuditEvent:
      type: object
      description: Who did what and when
      required: [id, message, createdAt, author, workspace]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the event
        message:
          type: string
          description: What happened
        createdAt:
          type: string
          format: date-time
          description: When it happened
        author:
          allOf:
            - $ref: "#/components/schemas/AuditEventAuthor"
          nullable: true
          description: The user who acted, null for an action without a signed-in user
        workspace:
          allOf:
            - $ref: "#/components/schemas/AuditEventWorkspace"
          nullable: true
          description: The workspace the event belongs to, null for an event outside any workspace
    AuditEventAuthor:
      type: object
      description: The user who acted, as they were at the time of the action
      required: [userId, email, name]
      properties:
        userId:
          type: string
          format: uuid
          description: The ID of the user
        email:
          type: string
          description: The address the user signed in with
        name:
          type: string
          description: The name of the user
    AuditEventWorkspace:
      type: object
      description: The workspace of an event
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the workspace
        name:
          type: string
          nullable: true
          description: The current name of the workspace, null when the workspace has been deleted
    AuditEventPage:
      type: object
      description: One page of audit events, the newest first
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
          description: The events on the page
        nextCursor:
          type: string
          description: The `after` of the next page, absent on the last page
    Notifier:
      type: object
      description: A notification channel of a workspace, without its secrets
      required: [id, workspaceId, name, lastSendError, settings]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the notifier
        workspaceId:
          type: string
          format: uuid
          description: The workspace the notifier belongs to
        name:
          type: string
          description: The name of the notifier
        lastSendError:
          type: string
