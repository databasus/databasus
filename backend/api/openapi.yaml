        again or the answer is 400 `invalid_request`, as in `updateNotifier`. Nothing leaves the
        backend on a refusal. Nothing is saved, the notifier's `lastSendError` included.
      requestBody:
        description: The settings to test.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifierSettingsTest"
      responses:
        "200":
          description: Whether the test message was delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifierTestResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /storages:
