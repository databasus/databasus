          $ref: "#/components/schemas/NotifierSettings"
    NotifierPage:
      type: object
      description: One page of notifiers, ordered by name
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notifier"
          description: The notifiers on the page
        nextCursor:
          type: string
          description: The `after` of the next page, absent on the last page
    NotifierCreate:
      type: object
      description: A new notifier
      required: [workspaceId, name, settings]
      properties:
        workspaceId:
          type: string
          format: uuid
          description: The workspace the notifier belongs to
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the notifier
        settings:
          $ref: "#/components/schemas/NotifierSettings"
    NotifierUpdate:
      type: object
      description: The editable fields of a notifier
      required: [name, settings]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the notifier
        settings:
          $ref: "#/components/schemas/NotifierSettings"
    NotifierTransfer:
      type: object
      description: The workspace a notifier moves to
      required: [targetWorkspaceId]
      properties:
        targetWorkspaceId:
          type: string
          format: uuid
          description: The ID of the target workspace
    NotifierSettingsTest:
      type: object
      description: Settings to send a test message with
      required: [workspaceId, settings]
      properties:
        workspaceId:
          type: string
          format: uuid
          description: The workspace the test is made in
        notifierId:
          type: string
          format: uuid
          description: A saved notifier of the workspace whose stored secrets fill the ones left out at its resource address
        settings:
          $ref: "#/components/schemas/NotifierSettings"
    NotifierTestResult:
      type: object
      description: The outcome of a test send
      required: [isDelivered]
      properties:
        isDelivered:
          type: boolean
          description: Whether the channel accepted the test message
        error:
          type: string
          description: The error the channel gave, absent when the message was delivered
    NotifierSettings:
      description: The settings of the notifier's channel; `type` tells the channels apart
      oneOf:
        - $ref: "#/components/schemas/EmailNotifierSettings"
        - $ref: "#/components/schemas/TelegramNotifierSettings"
        - $ref: "#/components/schemas/SlackNotifierSettings"
        - $ref: "#/components/schemas/DiscordNotifierSettings"
        - $ref: "#/components/schemas/TeamsNotifierSettings"
        - $ref: "#/components/schemas/MattermostNotifierSettings"
        - $ref: "#/components/schemas/WebhookNotifierSettings"
      discriminator:
        propertyName: type
        mapping:
          EMAIL: "#/components/schemas/EmailNotifierSettings"
          TELEGRAM: "#/components/schemas/TelegramNotifierSettings"
          SLACK: "#/components/schemas/SlackNotifierSettings"
          DISCORD: "#/components/schemas/DiscordNotifierSettings"
          TEAMS: "#/components/schemas/TeamsNotifierSettings"
          MATTERMOST: "#/components/schemas/MattermostNotifierSettings"
          WEBHOOK: "#/components/schemas/WebhookNotifierSettings"
    EmailNotifierSettings:
      type: object
      description: Email through the SMTP server of the notifier
      required: [type, targetEmail, smtpHost, smtpPort, isInsecureSkipVerify, security]
      properties:
        type:
          type: string
          enum: [EMAIL]
          description: Always `EMAIL`
        targetEmail:
          type: string
          description: The address the notifications go to
        smtpHost:
          type: string
          description: The host of the SMTP server
        smtpPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the SMTP server
        smtpUser:
          type: string
          description: The SMTP user, absent when the server needs no authentication
        smtpPassword:
          type: string
          writeOnly: true
          description: The SMTP password, given together with `smtpUser`
        from:
          type: string
          description: The sender, absent to derive it from the user and the host
        isInsecureSkipVerify:
          type: boolean
          description: Whether the TLS certificate of the server goes unchecked
        security:
          $ref: "#/components/schemas/SmtpSecurity"
        heloName:
          type: string
          description: The name the greeting uses, absent for the host of the instance's public address
    SmtpSecurity:
      type: string
      description: How the connection to the SMTP server is encrypted
      enum: [TLS, STARTTLS, NONE]
    TelegramNotifierSettings:
      type: object
      description: Messages of a Telegram bot
      required: [type, targetChatId, isProxyEnabled]
      properties:
        type:
          type: string
          enum: [TELEGRAM]
          description: Always `TELEGRAM`
        botToken:
          type: string
          writeOnly: true
          description: The token of the bot
        targetChatId:
          type: string
          description: The chat the bot writes to
        threadId:
          type: integer
          format: int64
          description: The topic of the chat, absent for a chat without topics
        isProxyEnabled:
          type: boolean
          description: Whether the messages go through a proxy
        proxyUrl:
          type: string
          writeOnly: true
          description: The http, https, socks5 or socks5h URL of the proxy, cleared when the proxy is off
        botApiUrl:
          type: string
          description: The Bot API server, absent for the official one
    SlackNotifierSettings:
      type: object
      description: Messages of a Slack bot
      required: [type, targetChatId]
      properties:
        type:
          type: string
          enum: [SLACK]
          description: Always `SLACK`
        botToken:
          type: string
          writeOnly: true
          description: The token of the bot
        targetChatId:
          type: string
          description: The channel ID, starting with C, G or D, or the user ID, starting with U
    DiscordNotifierSettings:
      type: object
      description: Messages to a Discord channel through its webhook
      required: [type]
      properties:
        type:
          type: string
          enum: [DISCORD]
          description: Always `DISCORD`
        channelWebhookUrl:
          type: string
          writeOnly: true
          description: The webhook URL of the channel
    TeamsNotifierSettings:
      type: object
      description: Messages to Microsoft Teams through a Power Automate workflow
      required: [type]
      properties:
        type:
          type: string
          enum: [TEAMS]
          description: Always `TEAMS`
        powerAutomateUrl:
          type: string
          writeOnly: true
          description: The URL of the workflow
    MattermostNotifierSettings:
      type: object
      description: Posts to Mattermost through an incoming webhook or a bot account
      required: [type, deliveryMode, isInsecureSkipVerify]
      properties:
        type:
          type: string
          enum: [MATTERMOST]
          description: Always `MATTERMOST`
        deliveryMode:
          type: string
          enum: [WEBHOOK, BOT]
          description: Whether the posts go through an incoming webhook or a bot account
        webhookUrl:
          type: string
          writeOnly: true
          description: The incoming webhook of the webhook mode
        serverUrl:
          type: string
          description: The server of the bot mode
        botToken:
          type: string
          writeOnly: true
          description: The token of the bot account
        targetChannelName:
          type: string
          description: The channel that overrides the incoming webhook's own
        targetChannelId:
          type: string
          description: The 26-character ID of the channel the bot posts to
        overrideUsername:
          type: string
          description: The name the posts show
        overrideIconUrl:
          type: string
          description: The icon the posts show
        isInsecureSkipVerify:
          type: boolean
          description: Whether the TLS certificate of the server goes unchecked
    WebhookNotifierSettings:
      type: object
      description: Requests to an HTTP endpoint the user runs
      required: [type, webhookUrl, webhookMethod, headers, acceptedCategories]
      properties:
        type:
          type: string
          enum: [WEBHOOK]
          description: Always `WEBHOOK`
        webhookUrl:
          type: string
          description: The endpoint
        webhookMethod:
          type: string
          enum: [POST, GET]
          description: GET carries the text in the query, POST in the body
        bodyTemplate:
          type: string
          description: >-
            The body of a POST, where `{{heading}}` and `{{message}}` are replaced; absent for a
            JSON body with `heading` and `message`
        headers:
          type: array
          items:
            $ref: "#/components/schemas/WebhookHeader"
          description: The headers every request carries
        acceptedCategories:
          type: array
          items:
            $ref: "#/components/schemas/NotificationCategory"
          description: The categories the webhook gets; `ALL` accepts every one
    WebhookHeader:
      type: object
      description: A header of the webhook's requests
      required: [name]
      properties:
        name:
          type: string
          description: >-
            The name of the header, an RFC 9110 token: one or more ASCII letters, digits or the characters
            !#$%&'*+-.^_`|~. Any other name is refused with 400
        value:
          type: string
          writeOnly: true
          description: The value; left out on a change at the same URL, it keeps the stored value of the header with this name
    NotificationCategory:
      type: string
      description: What a notification is about
      enum:
        - ALL
        - BACKUP_SUCCESS
        - BACKUP_FAILED
        - HEALTHCHECK_SUCCESS
        - HEALTHCHECK_FAILED
        - VERIFICATION_SUCCESS
        - VERIFICATION_FAILED
    Storage:
      type: object
      description: A place backups of a workspace are kept, without its secrets
      required: [id, workspaceId, name, settings]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the storage
        workspaceId:
          type: string
          format: uuid
          description: The workspace the storage belongs to
        name:
          type: string
          description: The name of the storage
        settings:
          $ref: "#/components/schemas/StorageSettings"
    StoragePage:
      type: object
      description: One page of storages, ordered by name
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Storage"
          description: The storages on the page
        nextCursor:
          type: string
          description: The `after` of the next page, absent on the last page
    StorageCreate:
      type: object
      description: A new storage
      required: [workspaceId, name, settings]
      properties:
        workspaceId:
          type: string
          format: uuid
          description: The workspace the storage belongs to
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the storage
        settings:
          $ref: "#/components/schemas/StorageSettings"
    StorageUpdate:
      type: object
      description: The editable fields of a storage
      required: [name, settings]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the storage
        settings:
          $ref: "#/components/schemas/StorageSettings"
    StorageTransfer:
      type: object
      description: The workspace a storage moves to
      required: [targetWorkspaceId]
      properties:
        targetWorkspaceId:
          type: string
          format: uuid
          description: The ID of the target workspace
    StorageSettingsTest:
      type: object
      description: Settings to test the connection with
      required: [workspaceId, settings]
      properties:
        workspaceId:
          type: string
          format: uuid
          description: The workspace the test is made in
        storageId:
          type: string
          format: uuid
          description: A saved storage of the workspace whose stored secrets fill the ones left out at its resource address
        settings:
          $ref: "#/components/schemas/StorageSettings"
    StorageTestResult:
      type: object
      description: The outcome of a connection test
      required: [isConnected]
      properties:
        isConnected:
          type: boolean
          description: Whether the storage could be reached and written
        error:
          type: string
          description: The error the storage gave, absent when it is connected
    StorageSettings:
      description: The settings of the storage's provider; `type` tells the providers apart
      oneOf:
        - $ref: "#/components/schemas/LocalStorageSettings"
        - $ref: "#/components/schemas/S3StorageSettings"
        - $ref: "#/components/schemas/GoogleDriveStorageSettings"
        - $ref: "#/components/schemas/NasStorageSettings"
        - $ref: "#/components/schemas/AzureBlobStorageSettings"
        - $ref: "#/components/schemas/FtpStorageSettings"
        - $ref: "#/components/schemas/SftpStorageSettings"
        - $ref: "#/components/schemas/RcloneStorageSettings"
      discriminator:
        propertyName: type
        mapping:
          LOCAL: "#/components/schemas/LocalStorageSettings"
          S3: "#/components/schemas/S3StorageSettings"
          GOOGLE_DRIVE: "#/components/schemas/GoogleDriveStorageSettings"
          NAS: "#/components/schemas/NasStorageSettings"
          AZURE_BLOB: "#/components/schemas/AzureBlobStorageSettings"
          FTP: "#/components/schemas/FtpStorageSettings"
          SFTP: "#/components/schemas/SftpStorageSettings"
          RCLONE: "#/components/schemas/RcloneStorageSettings"
    LocalStorageSettings:
      type: object
      description: The data folder of the Databasus instance
      required: [type]
      properties:
        type:
          type: string
          enum: [LOCAL]
          description: Always `LOCAL`
    S3StorageSettings:
      type: object
      description: A bucket of Amazon S3 or of a service compatible with it
      required: [type, s3Bucket, isVirtualHostedStyle, isSkipTlsVerify]
      properties:
        type:
          type: string
          enum: [S3]
          description: Always `S3`
        s3Bucket:
          type: string
          description: The bucket
        s3Region:
          type: string
          description: The region of the bucket, absent to look it up
        s3AccessKey:
          type: string
          writeOnly: true
          description: The access key ID
        s3SecretKey:
          type: string
          writeOnly: true
          description: The secret access key
        s3Endpoint:
          type: string
          description: The endpoint of a service compatible with S3, absent for AWS
        s3Prefix:
          type: string
          description: The prefix of every stored object, fixed when the storage is created
        isVirtualHostedStyle:
          type: boolean
          description: Whether the bucket is addressed as a subdomain of the endpoint
        isSkipTlsVerify:
          type: boolean
          description: Whether the TLS certificate of the endpoint goes unchecked
        s3StorageClass:
          $ref: "#/components/schemas/S3StorageClass"
    S3StorageClass:
      type: string
      description: The provider-defined storage class, forwarded unchanged; absent or empty selects the bucket's default
    GoogleDriveStorageSettings:
      type: object
      description: The Google Drive of the account that authorized the OAuth client
      required: [type, clientId]
      properties:
        type:
          type: string
          enum: [GOOGLE_DRIVE]
          description: Always `GOOGLE_DRIVE`
        clientId:
          type: string
          description: The ID of the OAuth client
        clientSecret:
          type: string
          writeOnly: true
          description: The secret of the OAuth client
        tokenJson:
          type: string
          writeOnly: true
          description: The OAuth token with its refresh token, as JSON
    NasStorageSettings:
      type: object
      description: A share of an SMB server
      required: [type, host, port, share, username, isSsl]
      properties:
        type:
          type: string
          enum: [NAS]
          description: Always `NAS`
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        share:
          type: string
          description: The share
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        isSsl:
          type: boolean
          description: Whether the connection is encrypted
        domain:
          type: string
          description: The domain of the account, absent for an account outside a domain
        path:
          type: string
          description: The folder inside the share, absent for its root
    AzureBlobStorageSettings:
      type: object
      description: A container of Azure Blob Storage
      required: [type, authMethod, containerName]
      properties:
        type:
          type: string
          enum: [AZURE_BLOB]
          description: Always `AZURE_BLOB`
        authMethod:
          $ref: "#/components/schemas/AzureBlobAuthMethod"
        connectionString:
          type: string
          writeOnly: true
          description: The connection string, used with `CONNECTION_STRING`
        accountName:
          type: string
          description: The storage account, used with `ACCOUNT_KEY`
        accountKey:
          type: string
          writeOnly: true
          description: The account key, used with `ACCOUNT_KEY`
        containerName:
          type: string
          description: The container
        endpoint:
          type: string
          description: The blob endpoint, absent for the account's default one
        prefix:
          type: string
          description: The prefix of every stored blob, fixed when the storage is created
    AzureBlobAuthMethod:
      type: string
      description: How the storage signs in to Azure
      enum: [CONNECTION_STRING, ACCOUNT_KEY]
    FtpStorageSettings:
      type: object
      description: A folder of an FTP server
      required: [type, host, port, username, isSsl, isSkipTlsVerify]
      properties:
        type:
          type: string
          enum: [FTP]
          description: Always `FTP`
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        path:
          type: string
          description: The folder on the server, absent for the login folder
        isSsl:
          type: boolean
          description: Whether the connection uses explicit TLS
        isSkipTlsVerify:
          type: boolean
          description: Whether the TLS certificate of the server goes unchecked
    SftpAuthMethod:
      type: string
      enum: [PASSWORD, PRIVATE_KEY]
      description: A credential kind selected for SFTP authentication
    SftpStorageSettings:
      type: object
      description: >-
        A folder of an SFTP server. Requests require explicit authentication methods; missing
        methods and explicitly empty credentials are rejected. Responses report stored methods
        without secrets. Existing rows need no migration.
      required: [type, host, port, username, authMethods, isSkipHostKeyVerify]
      properties:
        type:
          type: string
          enum: [SFTP]
          description: Always `SFTP`
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        username:
          type: string
          description: The user name
        authMethods:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SftpAuthMethod"
          description: Selected credentials; excluded credentials are removed on save
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: The selected password; omit to retain its stored value at the same host and port
        privateKey:
          type: string
          minLength: 1
          writeOnly: true
          description: The selected private key; omit to retain its stored value at the same host and port
        path:
          type: string
          description: The folder on the server, absent for the login folder
        isSkipHostKeyVerify:
          type: boolean
          description: >-
            Host-key verification preference. The transport currently ignores host keys regardless
            of this value; credential selection does not establish host authenticity.
    RcloneStorageSettings:
      type: object
      description: A remote of rclone; only an instance admin may write or test its configuration
      required: [type]
      properties:
        type:
          type: string
          enum: [RCLONE]
          description: Always `RCLONE`
        configContent:
          type: string
          writeOnly: true
          description: One remote section of an rclone configuration file
        remotePath:
          type: string
          description: The folder inside the remote, absent for its root
    Database:
      type: object
      description: A database a workspace backs up, without its secrets
      required: [id, workspaceId, name, settings, notifierIds]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the database
        workspaceId:
          type: string
          format: uuid
          description: The workspace the database belongs to
        name:
          type: string
          description: The name of the database
        settings:
          $ref: "#/components/schemas/DatabaseSettings"
        notifierIds:
          type: array
          items:
            type: string
            format: uuid
          description: The notifiers of the workspace that report the database's backups
        lastBackupTime:
          type: string
          format: date-time
          readOnly: true
          description: The time of the newest successful backup of any kind, absent before the first
        lastBackupErrorMessage:
          type: string
          readOnly: true
          description: The error of the last failed backup, absent after a success
        healthStatus:
          $ref: "#/components/schemas/DatabaseHealthStatus"
    DatabaseHealthStatus:
      type: string
      readOnly: true
      description: The outcome of the last scheduled health check, absent while health checks are off
      enum: [AVAILABLE, UNAVAILABLE]
    DatabasePage:
      type: object
      description: One page of databases, ordered by name
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Database"
          description: The databases on the page
        nextCursor:
          type: string
          description: The `after` of the next page, absent on the last page
    DatabaseCreate:
      type: object
      description: A new database
      required: [workspaceId, name, settings, notifierIds]
      properties:
        workspaceId:
          type: string
          format: uuid
          description: The workspace the database belongs to
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the database
        settings:
          $ref: "#/components/schemas/DatabaseSettings"
        notifierIds:
          type: array
          items:
            type: string
            format: uuid
          description: Notifiers of the workspace that report the database's backups
    DatabaseUpdate:
      type: object
      description: The editable fields of a database
      required: [name, settings, notifierIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the database
        settings:
          $ref: "#/components/schemas/DatabaseSettings"
        notifierIds:
          type: array
          items:
            type: string
            format: uuid
          description: Notifiers of the workspace that report the database's backups
    DatabaseSettingsTarget:
      type: object
      description: Settings that are not saved, to connect with
      required: [workspaceId, settings]
      properties:
        workspaceId:
          type: string
          format: uuid
          description: The workspace whose content the settings belong to
        databaseId:
          type: string
          format: uuid
          description: A saved database of the workspace whose stored secrets fill the ones left out at its resource address
        settings:
          $ref: "#/components/schemas/DatabaseSettings"
    DatabaseTestResult:
      type: object
      description: The outcome of a connection test
      required: [isConnected]
      properties:
        isConnected:
          type: boolean
          description: Whether the database could be connected to and backed up
        reason:
          $ref: "#/components/schemas/DatabaseConnectionFailure"
        error:
          type: string
          description: The error the server gave, absent when it is connected
    DatabaseConnectionFailure:
      type: string
      description: >-
        The class of a failed connection where the type tells it, absent for any other failure
      enum:
        - CONNECTION_FAILED
        - PG_HBA_NO_ENTRY
        - BAD_CREDENTIALS
        - NO_REPLICATION_PRIVILEGE
        - WAL_LEVEL_INVALID
        - NO_WAL_SENDERS
        - NO_REPLICATION_SLOTS
        - WAL_SUMMARY_DISABLED
        - CUSTOM_TABLESPACES
        - SYSTEM_IDENTIFIER_MISMATCH
        - NO_WAL_SWITCH_PRIVILEGE
    LimitedUserCheck:
      type: object
      description: Whether the connecting user may do more than a backup needs
      required: [isAdvisable, privileges]
      properties:
        isAdvisable:
          type: boolean
          description: Whether a limited user is advisable
        privileges:
          type: array
          items:
            type: string
          description: What the connecting user may do beyond what a backup needs
    LimitedUser:
      type: object
      description: A user created on the database's server for its backups
      required: [username, password, isForcedWalRotationAvailable]
      properties:
        username:
          type: string
          description: The generated user name
        password:
          type: string
          description: The generated password, returned only once
        isForcedWalRotationAvailable:
          type: boolean
          description: >-
            Whether a replication-only user may force a WAL segment switch; always false for a
            read-only user
    DatabaseSettings:
      description: The settings of the database's type; `type` tells the types apart
      oneOf:
        - $ref: "#/components/schemas/PostgresqlLogicalSettings"
        - $ref: "#/components/schemas/PostgresqlPhysicalSettings"
        - $ref: "#/components/schemas/MysqlSettings"
        - $ref: "#/components/schemas/MariadbSettings"
        - $ref: "#/components/schemas/MongodbSettings"
      discriminator:
        propertyName: type
        mapping:
          POSTGRES_LOGICAL: "#/components/schemas/PostgresqlLogicalSettings"
          POSTGRES_PHYSICAL: "#/components/schemas/PostgresqlPhysicalSettings"
          MYSQL: "#/components/schemas/MysqlSettings"
          MARIADB: "#/components/schemas/MariadbSettings"
          MONGODB: "#/components/schemas/MongodbSettings"
    SshTunnelSettings:
      type: object
      description: >-
        The SSH bastion a database is reached through. When it is enabled, the host and the port of
        the database address it as the bastion sees it
      required: [isEnabled]
      properties:
        isEnabled:
          type: boolean
          description: Whether the connection goes through the bastion
        host:
          type: string
          description: The host of the bastion
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The SSH port of the bastion
        username:
          type: string
          description: The user name on the bastion
        authType:
          $ref: "#/components/schemas/SshAuthType"
        password:
          type: string
          writeOnly: true
          description: The password, with `PASSWORD` authentication
        privateKey:
          type: string
          writeOnly: true
          description: The private key, with `PRIVATE_KEY` authentication
        privateKeyPassphrase:
          type: string
          writeOnly: true
          description: The passphrase of the private key, absent for a key without one
    SshAuthType:
      type: string
      description: How Databasus signs in to the bastion
      enum: [PASSWORD, PRIVATE_KEY]
    PostgresqlSslMode:
      type: string
      x-engine-values: true
      description: The libpq SSL mode of the connection
      enum: [disable, require, verify-ca, verify-full]
    PostgresqlVersion:
      type: string
      x-engine-values: true
      readOnly: true
      description: The major version the server reported at the last save
      enum: ["12", "13", "14", "15", "16", "17", "18"]
    PostgresqlLogicalSettings:
      type: object
      description: One PostgreSQL database backed up with pg_dump
      required:
        - type
        - host
        - port
        - username
        - sslMode
        - sshTunnel
        - includeSchemas
        - excludeTables
        - excludeTableData
        - cpuCount
        - isSkipUserMappings
      properties:
        type:
          type: string
          enum: [POSTGRES_LOGICAL]
          description: Always `POSTGRES_LOGICAL`
        version:
          $ref: "#/components/schemas/PostgresqlVersion"
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        database:
          type: string
          description: The database the dump reads, absent until one is picked
        sslMode:
          $ref: "#/components/schemas/PostgresqlSslMode"
        sslClientCert:
          type: string
          description: The PEM client certificate, absent without one
        sslClientKey:
          type: string
          writeOnly: true
          description: The PEM key of the client certificate
        sslRootCert:
          type: string
          description: The PEM root certificate the server is verified against, absent without one
        sshTunnel:
          $ref: "#/components/schemas/SshTunnelSettings"
        includeSchemas:
          type: array
          items:
            type: string
          description: The schemas the dump reads, empty for every schema
        excludeTables:
          type: array
          items:
            type: string
          description: The table patterns the dump leaves out
        excludeTableData:
          type: array
          items:
            type: string
          description: The table patterns whose rows the dump leaves out, keeping their definitions
        cpuCount:
          type: integer
          minimum: 1
          description: The number of parallel jobs of the dump and the restore
        isSkipUserMappings:
          type: boolean
          description: Whether the dump leaves out the user mappings of foreign servers
    PostgresqlPhysicalSettings:
      type: object
      description: A PostgreSQL cluster backed up with pg_basebackup and its WAL stream
      required: [type, host, port, username, sslMode, sshTunnel, backupType]
      properties:
        type:
          type: string
          enum: [POSTGRES_PHYSICAL]
          description: Always `POSTGRES_PHYSICAL`
        version:
          $ref: "#/components/schemas/PostgresqlVersion"
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        username:
          type: string
          description: The user name, which needs the replication privilege
        password:
          type: string
          writeOnly: true
          description: The password
        sslMode:
          $ref: "#/components/schemas/PostgresqlSslMode"
        sslClientCert:
          type: string
          description: The PEM client certificate, absent without one
        sslClientKey:
          type: string
          writeOnly: true
          description: The PEM key of the client certificate
        sslRootCert:
          type: string
          description: The PEM root certificate the server is verified against, absent without one
        sshTunnel:
          $ref: "#/components/schemas/SshTunnelSettings"
        backupType:
          $ref: "#/components/schemas/PhysicalBackupType"
        systemIdentifier:
          type: string
          readOnly: true
          description: The identifier of the cluster detected at the first save, which never changes
        walSegmentSizeBytes:
          type: integer
          format: int64
          readOnly: true
          description: The WAL segment size of the cluster detected at the first save
    PhysicalBackupType:
      type: string
      description: What the physical backups of the cluster take
      enum: [FULL, FULL_INCREMENTAL, FULL_INCREMENTAL_WAL_STREAM]
    MysqlVersion:
      type: string
      x-engine-values: true
      readOnly: true
      description: The version the server reported at the last save
      enum: ["5.7", "8.0", "8.4", "9", "26"]
    MysqlSettings:
      type: object
      description: One MySQL database backed up with mysqldump
      required: [type, host, port, username, isHttps, sshTunnel, excludeTables]
      properties:
        type:
          type: string
          enum: [MYSQL]
          description: Always `MYSQL`
        version:
          $ref: "#/components/schemas/MysqlVersion"
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        database:
          type: string
          description: The database the dump reads, absent until one is picked
        isHttps:
          type: boolean
          description: Whether the connection is encrypted, without verifying the server certificate
        sshTunnel:
          $ref: "#/components/schemas/SshTunnelSettings"
        excludeTables:
          type: array
          items:
            type: string
          description: The tables the dump leaves out
        privileges:
          type: array
          readOnly: true
          items:
            type: string
          description: The backup privileges the user held at the last save
    MariadbVersion:
      type: string
      x-engine-values: true
      readOnly: true
      description: The version the server reported at the last save
      enum: ["5.5", "10.1", "10.2", "10.3", "10.4", "10.5", "10.6", "10.11", "11.4", "11.8", "12.0", "13.0"]
    MariadbSettings:
      type: object
      description: One MariaDB database backed up with mariadb-dump
      required: [type, host, port, username, isHttps, sshTunnel, excludeTables, isExcludeEvents, isSkipGaleraDisable]
      properties:
        type:
          type: string
          enum: [MARIADB]
          description: Always `MARIADB`
        version:
          $ref: "#/components/schemas/MariadbVersion"
        host:
          type: string
          description: The host of the server
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        database:
          type: string
          description: The database the dump reads, absent until one is picked
        isHttps:
          type: boolean
          description: Whether the connection is encrypted, without verifying the server certificate
        sshTunnel:
          $ref: "#/components/schemas/SshTunnelSettings"
        excludeTables:
          type: array
          items:
            type: string
          description: The tables the dump leaves out
        isExcludeEvents:
          type: boolean
          description: Whether the dump leaves out the scheduled events
        isSkipGaleraDisable:
          type: boolean
          description: Whether the dump keeps Galera replication on for its session
        privileges:
          type: array
          readOnly: true
          items:
            type: string
          description: The backup privileges the user held at the last save
    MongodbVersion:
      type: string
      x-engine-values: true
      readOnly: true
      description: The major version the server reported at the last save
      enum: ["4", "5", "6", "7", "8", "9"]
    MongodbSettings:
      type: object
      description: One MongoDB database backed up with mongodump
      required:
        - type
        - host
        - username
        - database
        - authDatabase
        - isHttps
        - isSrv
        - isDirectConnection
        - cpuCount
        - sshTunnel
        - excludeCollections
      properties:
        type:
          type: string
          enum: [MONGODB]
          description: Always `MONGODB`
        version:
          $ref: "#/components/schemas/MongodbVersion"
        host:
          type: string
          description: The host of the server, or the DNS name of an SRV connection
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of the server, absent for an SRV connection
        username:
          type: string
          description: The user name
        password:
          type: string
          writeOnly: true
          description: The password
        database:
          type: string
          description: The database the dump reads
        authDatabase:
          type: string
          description: The database the user authenticates against
        isHttps:
          type: boolean
          description: Whether TLS is on, without verifying the server certificate
        isSrv:
          type: boolean
          description: Whether the host is resolved through DNS SRV records
        isDirectConnection:
          type: boolean
          description: Whether the client talks to the host alone instead of discovering the replica set
        cpuCount:
          type: integer
          minimum: 1
          description: The number of parallel collections of the dump and the restore
        sshTunnel:
          $ref: "#/components/schemas/SshTunnelSettings"
        excludeCollections:
          type: array
          items:
            type: string
          description: The collections the dump leaves out
    AgentArchitecture:
      type: string
      description: A processor architecture used by installed agents
      x-engine-values: true
      enum: [amd64, arm64]
    DiskUsage:
      type: object
      description: Space on the filesystem holding the data volume
      required: [totalSpaceBytes, usedSpaceBytes, freeSpaceBytes]
      properties:
        totalSpaceBytes:
          type: integer
          format: int64
          description: Total volume capacity in bytes
        usedSpaceBytes:
          type: integer
          format: int64
          description: Used volume space in bytes
        freeSpaceBytes:
          type: integer
          format: int64
          description: Free volume space in bytes
    HealthCheck:
      type: object
      description: One dependency monitoring result without internal errors
      required: [name, outcome]
      properties:
        name:
          type: string
          enum: [DISK, INTERNAL_DATABASE, CLIENT_TOOLS, VERIFICATION_AGENTS]
          description: The dependency being checked
        outcome:
          type: string
          enum: [PASSED, FAILED]
          description: Whether the dependency meets its monitoring check
        failureCode:
          type: string
          enum: [INSPECTION_FAILED, DISK_FULL, CONNECTION_FAILED, TOOLS_UNUSABLE, AGENTS_STALE, QUERY_FAILED]
          description: A safe reason for the failure
        staleAgentCount:
          type: integer
          description: The number of active agents older than five minutes
    JobHealth:
      type: object
      description: A copied observation of a job and its permitted pass duration
      required: [name, intervalSeconds, maxPassDurationSeconds, isRunning, isStale, activatedAt]
      properties:
        name:
          type: string
          description: The registered job name
        intervalSeconds:
          type: number
          format: double
          description: Delay between passes in seconds
        maxPassDurationSeconds:
          type: number
          format: double
          description: Monitoring budget in seconds that never cancels execution
        isRunning:
          type: boolean
          description: Whether a pass is running
        isStale:
          type: boolean
          description: Whether a completion or running-pass deadline has been reached
        activatedAt:
          type: string
          format: date-time
          description: The activation time used for first-pass grace
        lastStartedAt:
          type: string
          format: date-time
          description: The most recent pass start, absent before the first pass
        lastCompletedAt:
          type: string
          format: date-time
          description: The most recent completion, absent before a pass completes
        lastOutcome:
          type: string
          enum: [SUCCEEDED, FAILED, PANICKED, CANCELED]
          description: The outcome of the most recent completed pass
    HealthReport:
      type: object
      description: A healthy instance with complete dependency and job diagnostics
      required: [status, checks, jobs]
      properties:
        status:
          type: string
          enum: [HEALTHY]
          description: The instance monitoring status
        checks:
          type: array
          description: Every dependency check
          items:
            $ref: "#/components/schemas/HealthCheck"
        jobs:
          type: array
          description: Every registered job in name order
          items:
            $ref: "#/components/schemas/JobHealth"
    HealthProblem:
      description: An unhealthy instance with safe diagnostics and the instance_unhealthy code
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [checks, jobs]
          properties:
            checks:
              type: array
              description: Every dependency check
              items:
                $ref: "#/components/schemas/HealthCheck"
            jobs:
              type: array
              description: Every registered job in name order
              items:
                $ref: "#/components/schemas/JobHealth"
    Problem:
      type: object
      description: An error in the RFC 9457 format. The client chooses its text by `code`
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: A URI that identifies the kind of error
        title:
          type: string
          description: A short summary of the kind of error, the same for every error with this code
        status:
          type: integer
          description: The HTTP status of the response
        detail:
          type: string
          description: An explanation of this occurrence, meant for logs and scripts
        code:
          $ref: "#/components/schemas/ProblemCode"
        errors:
          type: array
          description: The fields that break the contract or a validation rule
          items:
            $ref: "#/components/schemas/FieldError"
    ProblemCode:
      type: string
      description: The cause of the error for programs; a value never changes its meaning
      enum:
        - invalid_request
        - unauthenticated
        - permission_denied
        - not_found
        - rate_limited
        - human_verification_failed
        - invalid_credentials
        - user_deactivated
        - registration_closed
        - email_taken
        - invalid_reset_code
        - oauth_not_configured
        - oauth_failed
        - pending_sign_in_not_usable
        - sign_in_code_not_sent
        - too_many_sign_in_codes
        - sign_in_code_resent_too_soon
        - sign_in_code_incorrect
        - email_not_configured
        - admin_email_missing
        - already_member
        - cannot_change_own_role
        - owner_requires_transfer
        - workspace_not_empty
        - in_use
        - cleanup_pending
        - database_connection_failed
        - backup_not_completed
        - already_running
        - not_running
        - no_extendable_chain
        - no_restorable_backup
        - target_time_unreachable
        - insufficient_disk_space
        - instance_unhealthy
        - internal
    FieldError:
      type: object
      description: A field of the request that breaks the contract or a validation rule
      required: [field, detail]
      properties:
        field:
          type: string
          description: The path of the field in the request, such as `name` or `settings.bucket`
        detail:
          type: string
          description: What is wrong with the field
    BackupConfigPage:
      type: object
      description: One page of backup configs, ordered by database ID
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupConfig"
          description: The configs on the page
        nextCursor:
          type: string
          description: The `after` of the next page, absent on the last page
    BackupConfig:
      type: object
      description: How a database is backed up
      required: [databaseId, isBackupsEnabled, storageId, encryption, settings, cleanup]
      properties:
        cleanup:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/BackupCleanup"
        databaseId:
          type: string
          format: uuid
          description: The database the config belongs to
        isBackupsEnabled:
          type: boolean
          description: Whether backups run on the schedule
        storageId:
          type: string
          format: uuid
          nullable: true
          description: The storage the backups are written to, null while the config names none
        encryption:
          $ref: "#/components/schemas/BackupEncryption"
        settings:
          $ref: "#/components/schemas/BackupSettings"
    BackupCleanup:
      type: object
      description: Current deletion obligations attributed to this database and its current workspace; ordinary protected uploads are excluded
      required: [pendingFileCount, failedFileCount]
      properties:
        pendingFileCount:
          type: integer
          format: int64
          minimum: 0
          description: Outstanding files, including delayed and claimed work
        failedFileCount:
          type: integer
          format: int64
          minimum: 0
          description: Pending files with a deletion error; a subset of pendingFileCount
    BackupConfigInput:
      type: object
      description: The editable fields of a backup config
      required: [isBackupsEnabled, storageId, encryption, settings]
      properties:
        isBackupsEnabled:
          type: boolean
          description: Whether backups run on the schedule
        storageId:
          type: string
          format: uuid
          nullable: true
          description: A storage of the database's workspace, or null to name none
        encryption:
          $ref: "#/components/schemas/BackupEncryption"
        settings:
          $ref: "#/components/schemas/BackupSettings"
    BackupEncryption:
      type: string
      description: Whether the backup files are encrypted with the instance's master key
      enum: [NONE, ENCRYPTED]
    BackupSettings:
      description: The settings of the database's backup method; `type` tells the methods apart
      oneOf:
        - $ref: "#/components/schemas/LogicalBackupSettings"
        - $ref: "#/components/schemas/PhysicalBackupSettings"
      discriminator:
        propertyName: type
        mapping:
          LOGICAL: "#/components/schemas/LogicalBackupSettings"
          PHYSICAL: "#/components/schemas/PhysicalBackupSettings"
    LogicalBackupSettings:
      type: object
      description: >-
        The settings of a logical backup, a dump of a PostgreSQL, MySQL, MariaDB or MongoDB database
      required: [type, schedule, retention, isRetryIfFailed, maxFailedTriesCount, notificationTriggers]
      properties:
        type:
          type: string
          enum: [LOGICAL]
          description: Always `LOGICAL`
        schedule:
          $ref: "#/components/schemas/Schedule"
        retention:
          $ref: "#/components/schemas/LogicalRetention"
        isRetryIfFailed:
          type: boolean
          description: Whether a failed backup is retried
        maxFailedTriesCount:
          type: integer
          description: How many times a failed backup is tried before it stays failed
        notificationTriggers:
          type: array
          items:
            $ref: "#/components/schemas/LogicalNotificationTrigger"
          description: The backup outcomes that send a notification through the database's notifiers
    PhysicalBackupSettings:
      type: object
      description: >-
        The settings of the physical backups of a physical PostgreSQL database. They must fit the
        database's physical backup type.
      required:
        [type, fullBackupSchedule, incrementalBackupSchedule, retention, walLagThresholdBytes, notificationTriggers]
      properties:
        type:
          type: string
          enum: [PHYSICAL]
          description: Always `PHYSICAL`
        fullBackupSchedule:
          $ref: "#/components/schemas/Schedule"
        incrementalBackupSchedule:
          allOf:
            - $ref: "#/components/schemas/Schedule"
          nullable: true
          description: >-
            When incremental backups run, null for a backup type without them. It must run more
            often than the full backups.
        retention:
          $ref: "#/components/schemas/PhysicalRetention"
        walLagThresholdBytes:
          type: integer
          format: int64
          description: >-
            The WAL lag after which the replication slot is rebuilt; 0 without WAL streaming and
            greater than 0 with it
        notificationTriggers:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTrigger"
          description: The backup outcomes that send a notification through the database's notifiers
    Schedule:
      type: object
      description: When recurring work runs; times of day are in UTC
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/ScheduleType"
        timeOfDay:
          type: string
          description: The time of day as `HH:MM`, required for daily, weekly and monthly schedules
        weekday:
          type: integer
          minimum: 0
          maximum: 7
          description: The day of a weekly schedule; 1 is Monday, and both 0 and 7 are Sunday
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          description: The day of a monthly schedule. In a month without this day, the schedule runs on the month's last day.
        cronExpression:
          type: string
          description: The five-field cron expression of a cron schedule; an expression with no date to run on, such as February 31, is refused
    ScheduleType:
      type: string
      description: How often a schedule runs
      enum: [HOURLY, DAILY, WEEKLY, MONTHLY, CRON]
    LogicalRetention:
      type: object
      description: >-
        Which logical backups are kept. `policy` picks the rule; the fields of the other rules keep
        their saved values.
      required: [policy, period, count, gfsHours, gfsDays, gfsWeeks, gfsMonths, gfsYears]
      properties:
        policy:
          $ref: "#/components/schemas/LogicalRetentionPolicy"
        period:
          $ref: "#/components/schemas/RetentionPeriod"
        count:
          type: integer
          description: How many of the newest backups `COUNT` keeps; greater than 0 with it
        gfsHours:
          type: integer
          description: For how many of the last hours `GFS` keeps the newest backup of each hour
        gfsDays:
          type: integer
          description: For how many of the last days `GFS` keeps the newest backup of each day
        gfsWeeks:
          type: integer
          description: For how many of the last weeks `GFS` keeps the newest backup of each week
        gfsMonths:
          type: integer
          description: For how many of the last months `GFS` keeps the newest backup of each month
        gfsYears:
          type: integer
          description: For how many of the last years `GFS` keeps the newest backup of each year
    LogicalRetentionPolicy:
      type: string
      description: >-
        `TIME_PERIOD` keeps backups for `period`, `COUNT` keeps the newest `count` backups, and `GFS`
        keeps backups by grandfather-father-son periods, at least one of them set
      enum: [TIME_PERIOD, COUNT, GFS]
    RetentionPeriod:
      type: string
      description: How long the `TIME_PERIOD` retention keeps a backup
      enum:
        [DAY, WEEK, MONTH, THREE_MONTHS, SIX_MONTHS, YEAR, TWO_YEARS, THREE_YEARS, FOUR_YEARS, FIVE_YEARS, FOREVER]
    PhysicalRetention:
      type: object
      description: Which physical backups are kept
      required: [policy, chainsCount, fullBackups]
      properties:
        policy:
          $ref: "#/components/schemas/PhysicalRetentionPolicy"
        chainsCount:
          type: integer
          description: >-
            How many of the newest chains, a full backup with its incrementals, are kept; greater than
            0 with `CHAINS` and `CHAINS_AND_FULL_BACKUPS`, and 0 with `FULL_BACKUPS`
        fullBackups:
          allOf:
            - $ref: "#/components/schemas/FullBackupsRetention"
          nullable: true
          description: Which full backups are kept; null with `CHAINS`
    PhysicalRetentionPolicy:
      type: string
      description: >-
        `CHAINS` keeps chains, `FULL_BACKUPS` keeps full backups, and `CHAINS_AND_FULL_BACKUPS`
        keeps both; a backup type without incremental backups takes only `FULL_BACKUPS`, and one
        with them takes the other two
      enum: [CHAINS, FULL_BACKUPS, CHAINS_AND_FULL_BACKUPS]
    FullBackupsRetention:
      type: object
      description: Which full backups are kept
      required: [policy, count, gfsHours, gfsDays, gfsWeeks, gfsMonths, gfsYears]
      properties:
        policy:
          $ref: "#/components/schemas/FullBackupsRetentionPolicy"
        count:
          type: integer
          description: How many of the newest full backups `LAST_N` keeps; 0 with `GFS`
        gfsHours:
          type: integer
          description: For how many of the last hours `GFS` keeps the newest full backup of each hour
        gfsDays:
          type: integer
          description: For how many of the last days `GFS` keeps the newest full backup of each day
        gfsWeeks:
          type: integer
          description: For how many of the last weeks `GFS` keeps the newest full backup of each week
        gfsMonths:
          type: integer
          description: For how many of the last months `GFS` keeps the newest full backup of each month
        gfsYears:
          type: integer
          description: For how many of the last years `GFS` keeps the newest full backup of each year
    FullBackupsRetentionPolicy:
      type: string
      description: >-
        `LAST_N` keeps the newest `count` full backups, and `GFS` keeps them by grandfather-father-son
        periods, at least one of them set
      enum: [LAST_N, GFS]
    NotificationTrigger:
      type: string
      description: >-
        A backup outcome that sends a notification: a failed or a successful backup, a broken chain
        of incremental backups, or a gap in the streamed WAL
      enum: [BACKUP_FAILED, BACKUP_SUCCESS, CHAIN_BROKEN, WAL_GAP]
    LogicalNotificationTrigger:
      type: string
      description: A logical backup outcome that sends a notification, a failed or a successful backup
      enum: [BACKUP_FAILED, BACKUP_SUCCESS]
    DatabaseTransfer:
      type: object
      description: The workspace a database moves to, and what happens to its storage and notifiers
      required: [targetWorkspaceId, storage, isMovingNotifiers]
      properties:
        targetWorkspaceId:
          type: string
          format: uuid
          description: The ID of the target workspace
        storage:
          $ref: "#/components/schemas/DatabaseTransferStorage"
        isMovingNotifiers:
          type: boolean
          description: >-
            Whether the database's notifiers move along; a notifier another database uses stays in
            its workspace
        targetNotifierIds:
          type: array
          items:
            type: string
            format: uuid
          description: Notifiers of the target workspace that replace the database's notifiers
    DatabaseTransferStorage:
      description: What happens to the database's storage; `type` tells the options apart
      oneOf:
        - $ref: "#/components/schemas/StorageMovedWithDatabase"
        - $ref: "#/components/schemas/StorageSwitchedOnTransfer"
      discriminator:
        propertyName: type
        mapping:
          MOVE_WITH_DATABASE: "#/components/schemas/StorageMovedWithDatabase"
          SWITCH_TO_STORAGE: "#/components/schemas/StorageSwitchedOnTransfer"
    StorageMovedWithDatabase:
      type: object
      description: >-
        The database's storage moves to the target workspace too; no other database may back up
        into it
      required: [type]
      properties:
        type:
          type: string
          enum: [MOVE_WITH_DATABASE]
          description: Always `MOVE_WITH_DATABASE`
    StorageSwitchedOnTransfer:
      type: object
      description: >-
        The database switches to a storage of the target workspace; the backups in its previous
        storage are removed from the catalog and their files are deleted in the background
      required: [type, storageId]
      properties:
        type:
          type: string
          enum: [SWITCH_TO_STORAGE]
          description: Always `SWITCH_TO_STORAGE`
        storageId:
          type: string
          format: uuid
          description: The storage of the target workspace
