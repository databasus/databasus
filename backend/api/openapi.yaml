    post:
      operationId: testStorage
      tags: [storages]
      summary: Test the connection of a saved storage
      description: >-
        Any member of the workspace may test, a viewer included. A connection the storage refuses
        is still a 200 that reports the storage's error. The test changes nothing in the storage.
      responses:
        "200":
          description: Whether the storage could be reached and written
