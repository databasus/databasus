openapi: 3.0.3
info:
  title: Databasus verification agent API
  version: 1.0.0
  description: The protocol used by the current verification agent. Previously installed agents discover and download the matching agent through the public system version and verification-agent operations; their agent requests can be rejected until self-update succeeds.
servers:
  - url: /api/v1
security:
  - agentToken: []
tags:
  - name: verification
    description: Capacity heartbeats and backup verification assignments and reports
paths:
  /agent/verification/{agentId}/heartbeat:
    post:
      operationId: recordHeartbeat
      tags: [verification]
      summary: Report capacity and running verifications
      description: Report capacity and running verifications using the authenticated agent token
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        description: Report capacity and running verifications input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: The recorded heartbeat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        default:
          $ref: "#/components/responses/Problem"
  /agent/verifications/{agentId}/claim:
    post:
      operationId: claimVerification
      tags: [verification]
      summary: Claim a pending verification
      description: >-
        Claim a pending verification using the authenticated agent token. New work is assigned only
        to an agent whose last accepted heartbeat (`lastSeenAt`) is at most five minutes old. A
        rejected heartbeat neither establishes nor extends that time. Authentication, rate limits and
        request validation apply first, whatever the age of the heartbeat.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        description: Claim a pending verification input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: The assigned verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationAssignment"
        "204":
          description: >-
            No work is assigned, because no verification fits the available capacity or the agent has
            no accepted heartbeat from the last five minutes
        default:
          $ref: "#/components/responses/Problem"
  /agent/verifications/{agentId}/{verificationId}/backup-stream:
    get:
      operationId: streamVerificationBackup
      tags: [verification]
      summary: Read the assigned backup
      description: Read the assigned backup using the authenticated agent token
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/VerificationId"
      responses:
        "200":
          description: The decrypted backup stream
          headers:
            Content-Disposition:
              required: true
              description: The attachment filename
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /agent/verifications/{agentId}/{verificationId}/report:
    post:
      operationId: reportVerification
      tags: [verification]
      summary: Report a verification outcome
      description: Report a verification outcome using the authenticated agent token
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/VerificationId"
      requestBody:
        required: true
        description: Report a verification outcome input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationReport"
      responses:
        "204":
          description: The outcome was recorded
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
      description: The current token issued for the agent named in the path
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      description: The verification agent ID
      schema:
        type: string
        format: uuid
    VerificationId:
      name: verificationId
      in: path
      required: true
      description: The verification ID
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An error in the RFC 9457 format
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HeartbeatRequest:
      type: object
      description: HeartbeatRequest
      required: [maxCpu, maxRamMb, maxDiskGb, maxConcurrentJobs, currentVerificationIds]
      properties:
        maxCpu:
          x-go-type-skip-optional-pointer: true
          x-go-name: MaxCPU
          type: integer
          minimum: 0
        maxRamMb:
          x-go-name: MaxRAMMb
          type: integer
          minimum: 0
        maxDiskGb:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
        maxConcurrentJobs:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
        currentVerificationIds:
          x-go-type-skip-optional-pointer: true
          x-go-name: CurrentVerificationIDs
          type: array
          items:
            type: string
            format: uuid
    HeartbeatResponse:
      type: object
      description: HeartbeatResponse
      required: [lastSeenAt, abortVerificationIds]
      properties:
        lastSeenAt:
          type: string
          format: date-time
        abortVerificationIds:
          x-go-name: AbortVerificationIDs
          type: array
          items:
            type: string
            format: uuid
    AgentCapacity:
      type: object
      description: AgentCapacity
      required: [maxCpu, maxRamMb, maxDiskGb, maxConcurrentJobs]
      properties:
        maxCpu:
          x-go-type-skip-optional-pointer: true
          x-go-name: MaxCPU
          type: integer
          minimum: 0
        maxRamMb:
          x-go-type-skip-optional-pointer: true
          x-go-name: MaxRAMMb
          type: integer
          minimum: 0
        maxDiskGb:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
        maxConcurrentJobs:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
    ClaimRequest:
      type: object
      description: ClaimRequest
      required: [capacity]
      properties:
        capacity:
          x-go-type-skip-optional-pointer: true
          allOf:
            - $ref: "#/components/schemas/AgentCapacity"
    AssignedPostgresql:
      type: object
      description: AssignedPostgresql
      required: [version]
      properties:
        version:
          type: string
    AssignedDatabase:
      type: object
      description: AssignedDatabase
      required: [type]
      properties:
        type:
          type: string
        postgresqlLogical:
          $ref: "#/components/schemas/AssignedPostgresql"
    VerificationAssignment:
      type: object
      description: VerificationAssignment
      required: [verificationId, backupId, backupSizeMb, maxContainerDiskMb, database, timescaledbVersion]
      properties:
        verificationId:
          x-go-name: VerificationID
          type: string
          format: uuid
        backupId:
          x-go-name: BackupID
          type: string
          format: uuid
        backupSizeMb:
          type: number
          format: double
        maxContainerDiskMb:
          type: number
          format: double
        database:
          $ref: "#/components/schemas/AssignedDatabase"
        timescaledbVersion:
          type: string
    ReportTableStat:
      type: object
      description: ReportTableStat
      required: [schemaName, name, rowCount]
      properties:
        schemaName:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        rowCount:
          type: integer
          format: int64
    VerificationReport:
      type: object
      description: VerificationReport
      required: [status]
      properties:
        status:
          type: string
          enum: [COMPLETED, FAILED]
        pgRestoreExitCode:
          type: integer
          nullable: true
        failureKind:
          type: string
          nullable: true
        restoreDurationMs:
          type: integer
          format: int64
          nullable: true
        verifyDurationMs:
          type: integer
          format: int64
          nullable: true
        dbSizeBytesAfterRestore:
          x-go-name: DBSizeBytesAfterRestore
          type: integer
          format: int64
          nullable: true
        tableCount:
          type: integer
          nullable: true
        schemaCount:
          type: integer
          nullable: true
        tableStats:
          x-go-type-skip-optional-pointer: true
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ReportTableStat"
        failMessage:
          type: string
          nullable: true
        failureDiagnostic:
          $ref: "#/components/schemas/VerificationFailureDiagnostic"
    VerificationFailureDiagnostic:
      description: Sanitized failure output for FAILED reports only. Omit when unavailable. Limited to 65536 decoded UTF-8 bytes including omission markers.
      type: object
      required: [output, isTruncated]
      properties:
        output:
          type: string
          minLength: 1
          maxLength: 65536
          description: Nonempty output. More than 65536 decoded UTF-8 bytes is invalid_request without mutation.
        isTruncated:
          type: boolean
    Problem:
      type: object
      description: An error in the RFC 9457 format. The client chooses its text by `code`
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: A URI that identifies the kind of error
        title:
          type: string
          description: A short summary of the kind of error, the same for every error with this code
        status:
          type: integer
          description: The HTTP status of the response
        detail:
          type: string
          description: An explanation of this occurrence, meant for logs and scripts
        code:
          $ref: "#/components/schemas/ProblemCode"
        errors:
          type: array
          description: The fields that break the contract or a validation rule
          items:
            $ref: "#/components/schemas/FieldError"
    ProblemCode:
      type: string
      description: The cause of the error for programs; a value never changes its meaning
      enum: [invalid_request, unauthenticated, rate_limited, verification_gone, internal]
    FieldError:
      type: object
      description: A field of the request that breaks the contract or a validation rule
      required: [field, detail]
      properties:
        field:
          type: string
          description: The path of the field in the request, such as `name` or `settings.bucket`
        detail:
          type: string
          description: What is wrong with the field
