name: Dependency Review

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select the release baseline
        id: release-baseline
        run: |
          release_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0)
          release_commit=$(git rev-parse "${release_tag}^{commit}")
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ steps.release-baseline.outputs.commit }}
          head-ref: ${{ github.sha }}
          comment-summary-in-pr: never
