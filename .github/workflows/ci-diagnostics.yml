name: CI diagnostics

on:
  push:
    branches: [fix/ci-security-and-tooling]

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  build-storage-image:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build amd64 storage candidate and load locally
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=storage-${{ github.sha }}
          tags: databasus-storage-test:${{ github.sha }}

      - name: Export the storage candidate
        run: docker save databasus-storage-test:${{ github.sha }} | zstd -T0 -3 > /tmp/databasus-storage-test.tar.zst

      - name: Upload the storage candidate
        id: upload-the-storage-candidate-1
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: databasus-storage-test
          path: /tmp/databasus-storage-test.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload the storage candidate (attempt 2)
        id: upload-the-storage-candidate-2
        if: steps.upload-the-storage-candidate-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: databasus-storage-test
          path: /tmp/databasus-storage-test.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload the storage candidate (attempt 3)
        id: upload-the-storage-candidate-3
        if: steps.upload-the-storage-candidate-2.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: databasus-storage-test
          path: /tmp/databasus-storage-test.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  test-upgrade:
    needs: [build-storage-image]
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 30
    steps:
      # The previous release is the newest v* tag, which lives on main, so the checkout needs every tag.
      - name: Check out code with tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go'

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Download the storage candidate
        id: download-the-storage-candidate-1
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Download the storage candidate (attempt 2)
        id: download-the-storage-candidate-2
        if: steps.download-the-storage-candidate-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Download the storage candidate (attempt 3)
        id: download-the-storage-candidate-3
        if: steps.download-the-storage-candidate-2.outcome == 'failure'
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Load the storage candidate
        run: zstd -dc /tmp/databasus-storage-test.tar.zst | docker load

      - name: Run the upgrade test
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ github.sha }}
        run: mise run backend:test-upgrade

  test-filesystems:
    needs: [build-storage-image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: permissions
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install network filesystem clients
        if: matrix.group == 'network'
        run: sudo apt-get update && sudo apt-get install -y cifs-utils nfs-common

      - name: Download the storage candidate
        id: download-the-storage-candidate-1
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Download the storage candidate (attempt 2)
        id: download-the-storage-candidate-2
        if: steps.download-the-storage-candidate-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Download the storage candidate (attempt 3)
        id: download-the-storage-candidate-3
        if: steps.download-the-storage-candidate-2.outcome == 'failure'
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Load the storage candidate
        run: zstd -dc /tmp/databasus-storage-test.tar.zst | docker load

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false

      - name: Run filesystem suite
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ github.sha }}
          CASE_GROUP: ${{ matrix.group }}
        run: mise run test-filesystem

  test-e2e-browser:
    needs: [build-storage-image]
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download the storage candidate
        id: download-the-storage-candidate-1
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Download the storage candidate (attempt 2)
        id: download-the-storage-candidate-2
        if: steps.download-the-storage-candidate-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Download the storage candidate (attempt 3)
        id: download-the-storage-candidate-3
        if: steps.download-the-storage-candidate-2.outcome == 'failure'
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Load the storage candidate
        run: zstd -dc /tmp/databasus-storage-test.tar.zst | docker load

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'python uv'

      - name: Check the suite's own code
        run: mise run e2e:unit

      - name: Run the browser end-to-end suite
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ github.sha }}
        run: mise run e2e:browser

      - name: Check the suite's cleanup and failure handling
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ github.sha }}
        run: mise run e2e:lifecycle

  build-image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build image and load locally
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
          tags: |
            databasus:smoke-${{ github.sha }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'aqua:aquasecurity/trivy'

      - name: Check image
        run: scripts/check_image.sh databasus:smoke-${{ github.sha }}

  test-backend:
    # 22.04 runs Linux 6.8. ubuntu-24.04 moved to Linux 7.0, where mongod 9.0 exits at startup:
    # its kernel check reads Ubuntu's 7.0.0 release string as an rseq-incompatible kernel
    # (SERVER-121912, SERVER-136848).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Only other runs many packages at once. The rest run one to four packages, so twice the
        # vCPU would only hold a larger share of the concurrency limit.
        include:
          - group: physical-api-3-of-3
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go golangci-lint'

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Install database client dependencies
        run: |
          # The bundled assets/tools clients are Debian-built; Ubuntu ships no libncurses5/libtinfo5
          # package at all, and the ABI-identical .so.6 satisfies them via these symlinks.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libedit2 libncurses6 libtinfo6 libpq5 libmariadb3 libgnutls30 zstd netcat-openbsd
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Download Go modules
        run: |
          cd backend
          go mod download

      - name: Create .env file for testing
        run: cp .env.example .env

      - name: Start test containers
        run: |
          docker compose -f docker-compose.yml up -d backend-db-test

      - name: Wait for containers to be ready
        run: |
          # Wait for test database (postgres listens on 5432 inside the container)
          timeout 60 bash -c 'until docker exec backend-db-test pg_isready -U postgres; do sleep 2; done'

      - name: Create data and temp directories
        run: |
          # Create directories that are used for backups and restore
          # These paths match what's configured in config.go
          mkdir -p databasus-data/backups
          mkdir -p databasus-data/temp

      - name: Pull testcontainer images
        run: mise run backend:pull-testcontainers

      - name: Run Go tests
        env:
          # Ryuk stays disabled to match scripts/test.sh, so CI and local runs share one code path.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          TEST_GROUP: ${{ matrix.group }}
        run: |
          cd backend
          # Separate assignments let a failing task stop the step instead of running no tests.
          packages=$(mise run backend:test-group-packages "$TEST_GROUP")
          run_pattern=$(mise run backend:test-group-tests "$TEST_GROUP")
          # Each leg runs one group on its own runner and allows extra time for CI contention.
          # shellcheck disable=SC2086 # one import path per word
          go test -race -p=8 -count=1 -failfast -timeout 40m ${run_pattern:+-run "$run_pattern"} $packages

  lint-fixtures:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'node pnpm'

      - name: Set up pnpm cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm exec vitest run tooling/frontendLintRules.test.ts

  dependency-review:
    uses: ./.github/workflows/dependency-review.yml
