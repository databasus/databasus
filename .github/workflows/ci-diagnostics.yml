name: CI diagnostics

on:
  push:
    branches: [fix/ci-security-and-tooling]

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  lint-fixtures:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [namespace-profile-2vcpu-4ram-ubuntu-26-x64, namespace-profile-4vcpu-8ram-ubuntu-26-x64]
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'node pnpm'

      - name: Set up pnpm cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Inspect allocator constraints
        run: |
          ulimit -a
          cat /proc/sys/vm/overcommit_memory /proc/sys/vm/overcommit_ratio
          grep -E 'MemTotal|CommitLimit|Committed_AS' /proc/meminfo
          cd frontend
          pnpm exec oxlint --threads=1 -c oxlint.config.ts -f unix tooling/frontendLintRules.test.ts

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm exec vitest run tooling/frontendLintRules.test.ts

