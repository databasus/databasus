name: CI and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

# mise installs every tool of mise.toml before a task by default, so each job installs only the
# tools its tasks need through install_args.
env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

concurrency:
  group: ci-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  lint-python:
    uses: ./.github/workflows/lint-python.yml

  lint-backend:
    runs-on: namespace-profile-8vcpu-16ram-ubuntu-22-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go golangci-lint vacuum go:golang.org/x/vuln/cmd/govulncheck'

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Download Go modules
        run: |
          cd backend
          go mod download

      - name: Verify Go module checksums
        run: |
          cd backend
          go mod verify

      - name: Run the backend lint
        run: mise run backend:lint

      - name: Scan for reachable vulnerabilities
        run: mise run security:go

  lint-frontend:
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'node pnpm'

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run the frontend lint
        run: mise run frontend:lint

      - name: Build frontend
        run: |
          cd frontend
          pnpm build

  lint-shell:
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'shellcheck'

      - name: Run shellcheck
        run: mise run lint-shell

  test-scripts:
    name: test-scripts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go shellcheck jq node pnpm python uv ruff ty hk'

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Test the full test run script
        run: |
          uv sync --locked --project e2e/browser
          python3 -m unittest discover -s scripts -p '*_test.py'


  lint-workflows:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'actionlint'

      - name: Run actionlint
        run: mise run lint-workflows

  dockerfile-scan:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'aqua:aquasecurity/trivy'

      - name: Trivy Dockerfile misconfiguration scan
        run: |
          trivy config --severity HIGH,CRITICAL --exit-code 1 Dockerfile
          trivy config --severity HIGH,CRITICAL --exit-code 1 backend/cmd/verification-agent/images/postgres/Dockerfile
          trivy config --severity HIGH,CRITICAL --exit-code 1 e2e/docker-storage/nfs/Dockerfile
          trivy config --severity HIGH,CRITICAL --exit-code 1 backend/internal/lib/testcontainers/testdata/sftp/Dockerfile
          trivy config --severity HIGH,CRITICAL --exit-code 1 backend/internal/lib/testcontainers/testdata/ftp/Dockerfile

  test-frontend:
    name: test-frontend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'node pnpm'

      - name: Set up pnpm cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm test

  test-frontend-browser-ui:
    name: test-frontend-browser-ui (${{ matrix.arch }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            shard: 1
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: amd64
            shard: 2
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: amd64
            shard: 3
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            shard: 1
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - arch: arm64
            shard: 2
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - arch: arm64
            shard: 3
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'node pnpm'

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Verify production browser UI
        run: pnpm --dir frontend test:browser --project=ui --shard=${{ matrix.shard }}/3

      - name: Upload synthetic browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-browser-ui-${{ matrix.arch }}-${{ matrix.shard }}-of-3
          path: frontend/browser-results/
          retention-days: 7

  test-e2e-browser:
    needs: [build-storage-image]
    name: test-e2e-browser (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARTIFACT_NAME: databasus-storage-test-${{ matrix.arch }}
      ARTIFACT_PATTERN: ''
      ARTIFACT_PATH: /tmp
      ARTIFACT_MERGE_MULTIPLE: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - &download-artifact-1
        name: Download artifact
        id: download-artifact-1
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          pattern: ${{ env.ARTIFACT_PATTERN }}
          path: ${{ env.ARTIFACT_PATH }}
          merge-multiple: ${{ env.ARTIFACT_MERGE_MULTIPLE }}

      - &download-artifact-2
        name: Download artifact (attempt 2)
        id: download-artifact-2
        if: steps.download-artifact-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          pattern: ${{ env.ARTIFACT_PATTERN }}
          path: ${{ env.ARTIFACT_PATH }}
          merge-multiple: ${{ env.ARTIFACT_MERGE_MULTIPLE }}

      - &download-artifact-3
        name: Download artifact (attempt 3)
        id: download-artifact-3
        if: steps.download-artifact-2.outcome == 'failure'
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          pattern: ${{ env.ARTIFACT_PATTERN }}
          path: ${{ env.ARTIFACT_PATH }}
          merge-multiple: ${{ env.ARTIFACT_MERGE_MULTIPLE }}

      - name: Load the storage candidate
        run: |
          zstd -dc /tmp/databasus-storage-test-${{ matrix.arch }}.tar.zst | docker load
          scripts/check_native_architecture.sh ${{ matrix.arch }} databasus-storage-test:${{ github.sha }}-${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'python uv'

      - name: Check the suite's own code
        run: mise run e2e:unit

      - name: Run the browser end-to-end suite
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ github.sha }}-${{ matrix.arch }}
        run: mise run e2e:browser

  test-e2e-browser-lifecycle:
    needs: [build-storage-image]
    name: test-e2e-browser-lifecycle (${{ matrix.arch }}, ${{ matrix.group }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARTIFACT_NAME: databasus-storage-test-${{ matrix.arch }}
      ARTIFACT_PATTERN: ''
      ARTIFACT_PATH: /tmp
      ARTIFACT_MERGE_MULTIPLE: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            group: failures
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: amd64
            group: interruption
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: amd64
            group: isolation
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            group: failures
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - arch: arm64
            group: interruption
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - arch: arm64
            group: isolation
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - *download-artifact-1

      - *download-artifact-2

      - *download-artifact-3

      - name: Load the storage candidate
        run: |
          zstd -dc /tmp/databasus-storage-test-${{ matrix.arch }}.tar.zst | docker load
          scripts/check_native_architecture.sh ${{ matrix.arch }} databasus-storage-test:${{ github.sha }}-${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'python uv'

      - name: Check the suite's cleanup and failure handling
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ github.sha }}-${{ matrix.arch }}
        run: mise run e2e:lifecycle ${{ matrix.group }}

  test-verification-agent:
    name: test-verification-agent (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go ripgrep'

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Download Go modules
        run: |
          cd backend
          go mod download

      - name: Run Go tests
        run: mise run agent:test

  e2e-verification-agent-podman:
    # Namespace runners are containers without systemd whose seccomp profile denies
    # pivot_root, so rootful Podman cannot start containers there.
    name: e2e-verification-agent-podman (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go python'

      - &install-database-clients
        name: Install database client dependencies
        run: |
          # The bundled assets/tools clients are Debian-built; Ubuntu ships no libncurses5/libtinfo5
          # package at all, and the ABI-identical .so.6 satisfies them via these symlinks.
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev libedit2 libncurses6 libtinfo6 libpq5 libmariadb3 libgnutls30 zstd netcat-openbsd
          library_directory="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          sudo ln -sf "${library_directory}/libncurses.so.6" "${library_directory}/libncurses.so.5"
          sudo ln -sf "${library_directory}/libtinfo.so.6" "${library_directory}/libtinfo.so.5"

      - &download-backend-modules
        name: Download Go modules
        run: |
          cd backend
          go mod download

      - &create-backend-test-environment
        name: Create .env file for testing
        run: cp .env.example .env

      - &start-backend-test-database
        name: Start test containers
        run: |
          docker compose -f docker-compose.yml up -d backend-db-test

      - &wait-for-backend-test-database
        name: Wait for containers to be ready
        run: |
          # Wait for test database (postgres listens on 5432 inside the container)
          timeout 60 bash -c 'until docker exec backend-db-test pg_isready -U postgres; do sleep 2; done'

      - &create-backend-test-directories
        name: Create data and temp directories
        run: |
          # Create directories that are used for backups and restore
          # These paths match what's configured in config.go
          mkdir -p databasus-data/backups
          mkdir -p databasus-data/temp

      - name: Start rootful Podman socket
        run: |
          sudo apt-get install -y acl podman
          sudo systemctl start podman.socket
          sudo setfacl -m u:"$USER":x /run/podman
          sudo setfacl -m u:"$USER":rw /run/podman/podman.sock
          sudo podman version
          sudo podman info --format '{{.Host.OCIRuntime.Name}}'

      - name: Run e2e tests on Podman
        run: mise run agent:e2e-podman

      - name: Cleanup
        if: always()
        run: |
          sudo podman ps -aq --filter label=databasus.verification.agent_id | xargs -r sudo podman rm -f || true
          sudo podman network ls -q --filter label=databasus.verification.agent_id | xargs -r sudo podman network rm || true

  test-backend:
    # 22.04 runs Linux 6.8. ubuntu-24.04 moved to Linux 7.0, where mongod 9.0 exits at startup:
    # its kernel check reads Ubuntu's 7.0.0 release string as an rseq-incompatible kernel
    # (SERVER-121912, SERVER-136848).
    name: test-backend (${{ matrix.arch }}, ${{ matrix.group }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Logical tests run several database engines concurrently; other runs many packages.
        include:
          - group: other-1-of-3
            arch: amd64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-x64
          - group: other-1-of-3
            arch: arm64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-arm
          - group: other-2-of-3
            arch: amd64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-x64
          - group: other-2-of-3
            arch: arm64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-arm
          - group: other-3-of-3
            arch: amd64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-x64
          - group: other-3-of-3
            arch: arm64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-arm
          - group: storage-providers
            arch: amd64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-x64
          - group: storage-providers
            arch: arm64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-arm
          - group: agent-e2e
            arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: agent-e2e
            arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - group: logical
            arch: amd64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-x64
          - group: logical
            arch: arm64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-arm
          - group: physical-1-of-3
            arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: physical-1-of-3
            arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - group: physical-2-of-3
            arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: physical-2-of-3
            arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - group: physical-3-of-3
            arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: physical-3-of-3
            arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - group: physical-api-1-of-3
            arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: physical-api-1-of-3
            arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - group: physical-api-2-of-3
            arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: physical-api-2-of-3
            arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
          - group: physical-api-3-of-3
            arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: physical-api-3-of-3
            arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go golangci-lint jq'

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - *install-database-clients

      - *download-backend-modules

      - *create-backend-test-environment

      - *start-backend-test-database

      - *wait-for-backend-test-database

      - *create-backend-test-directories

      - name: Pull testcontainer images
        run: mise run backend:pull-testcontainers

      - name: Run Go tests
        env:
          # Ryuk stays disabled to match scripts/test.sh, so CI and local runs share one code path.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          TEST_GROUP: ${{ matrix.group }}
          # Container-heavy binaries share a runner; Go's per-binary default multiplies their load.
          TEST_PARALLELISM: '2'
        run: |
          cd backend
          # Separate assignments let a failing task stop the step instead of running no tests.
          packages=$(mise run backend:test-group-packages "$TEST_GROUP")
          run_pattern=$(mise run backend:test-group-tests "$TEST_GROUP")
          report_runner_resources() {
            for resource in /proc/loadavg /proc/pressure/{cpu,memory,io} /sys/fs/cgroup/{cpu.stat,memory.current,memory.peak,memory.events}; do
              if [[ -r "$resource" ]]; then
                printf '\n%s\n' "$resource"
                cat "$resource"
              fi
            done
            timeout 15 docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} memory={{.MemUsage}}' || true
          }
          report_runner_resources
          trap report_runner_resources EXIT
          if [[ "$TEST_GROUP" == storage-providers ]]; then
            # The latency regression needs exclusive use of its runner.
            isolated_package=databasus-backend/internal/modules/storages/internal/providers
            [[ "$packages" == "$isolated_package" && -z "$run_pattern" ]]
            go test -race -p=1 -parallel=1 -count=1 -failfast -timeout 40m "$isolated_package"
            exit
          fi
          # Each leg runs one group on its own runner and allows extra time for CI contention.
          # shellcheck disable=SC2086 # one import path per word
          go test -race -p=8 -parallel="$TEST_PARALLELISM" -count=1 -failfast -timeout 40m ${run_pattern:+-run "$run_pattern"} $packages

  build-storage-image:
    name: build-storage-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARTIFACT_NAME: databasus-storage-test-${{ matrix.arch }}
      ARTIFACT_PATH: /tmp/databasus-storage-test-${{ matrix.arch }}.tar.zst
      ARTIFACT_TIMEOUT_MINUTES: '5'
      ARTIFACT_COMPRESSION_LEVEL: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Build native storage candidate and load locally
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_VERSION=storage-${{ github.sha }}
          tags: databasus-storage-test:${{ github.sha }}-${{ matrix.arch }}

      - name: Export the storage candidate
        run: docker save databasus-storage-test:${{ github.sha }}-${{ matrix.arch }} | zstd -T0 -3 > /tmp/databasus-storage-test-${{ matrix.arch }}.tar.zst

      - &upload-artifact-1
        name: Upload artifact
        id: upload-artifact-1
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.ARTIFACT_TIMEOUT_MINUTES) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          compression-level: ${{ env.ARTIFACT_COMPRESSION_LEVEL }}
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - &upload-artifact-2
        name: Upload artifact (attempt 2)
        id: upload-artifact-2
        if: steps.upload-artifact-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.ARTIFACT_TIMEOUT_MINUTES) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          compression-level: ${{ env.ARTIFACT_COMPRESSION_LEVEL }}
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - &upload-artifact-3
        name: Upload artifact (attempt 3)
        id: upload-artifact-3
        if: steps.upload-artifact-2.outcome == 'failure'
        timeout-minutes: ${{ fromJSON(env.ARTIFACT_TIMEOUT_MINUTES) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          compression-level: ${{ env.ARTIFACT_COMPRESSION_LEVEL }}
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  test-filesystems:
    needs: [build-storage-image]
    name: test-filesystems (${{ matrix.arch }}, ${{ matrix.group }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARTIFACT_NAME: databasus-storage-test-${{ matrix.arch }}
      ARTIFACT_PATTERN: ''
      ARTIFACT_PATH: /tmp
      ARTIFACT_MERGE_MULTIPLE: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: permissions
            arch: amd64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-x64
          - group: permissions
            arch: arm64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-arm
          - group: upgrades
            arch: amd64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-x64
          - group: upgrades
            arch: arm64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-arm
          - group: lifecycle
            arch: amd64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-x64
          - group: lifecycle
            arch: arm64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-arm
          # The Docker engine on Namespace runners has no CIFS or NFS kernel support, so
          # the network filesystem cases can only mount their volumes on GitHub runners.
          - group: network
            arch: amd64
            runner: ubuntu-24.04
          - group: network
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Install network filesystem clients
        if: matrix.group == 'network'
        run: sudo apt-get update && sudo apt-get install -y cifs-utils nfs-common

      - *download-artifact-1

      - *download-artifact-2

      - *download-artifact-3

      - name: Load the storage candidate
        run: |
          zstd -dc /tmp/databasus-storage-test-${{ matrix.arch }}.tar.zst | docker load
          scripts/check_native_architecture.sh ${{ matrix.arch }} databasus-storage-test:${{ github.sha }}-${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false

      - name: Run filesystem suite
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ github.sha }}-${{ matrix.arch }}
          CASE_GROUP: ${{ matrix.group }}
        run: mise run test-filesystem

  test-upgrade:
    needs: [build-storage-image]
    name: test-upgrade (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARTIFACT_NAME: databasus-storage-test-${{ matrix.arch }}
      ARTIFACT_PATTERN: ''
      ARTIFACT_PATH: /tmp
      ARTIFACT_MERGE_MULTIPLE: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      # The previous release is the newest v* tag, which lives on main, so the checkout needs every tag.
      - name: Check out code with tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go'

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - *download-artifact-1

      - *download-artifact-2

      - *download-artifact-3

      - name: Load the storage candidate
        run: |
          zstd -dc /tmp/databasus-storage-test-${{ matrix.arch }}.tar.zst | docker load
          scripts/check_native_architecture.sh ${{ matrix.arch }} databasus-storage-test:${{ github.sha }}-${{ matrix.arch }}

      - name: Run the upgrade test
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ github.sha }}-${{ matrix.arch }}
        run: mise run backend:test-upgrade

  build-image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            platform: linux/arm64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Build image and load locally
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
          tags: |
            databasus:smoke-${{ github.sha }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'aqua:aquasecurity/trivy'

      - name: Check image
        run: scripts/check_image.sh databasus:smoke-${{ github.sha }}

  build-verification-image:
    name: build-verification-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # A representative major checks the Dockerfile before version selection;
      # publishing builds the full multi-arch matrix.
      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Build native verification image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: backend/cmd/verification-agent/images/postgres
          push: false
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PG_MAJOR=16

  # Reports under its own CodeQL configuration, which scripts/check_codeql_alerts.sh relies on.
  code-scanning:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      is-release-gate: true

  dependency-review:
    uses: ./.github/workflows/dependency-review.yml

  determine-version:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 10
    needs:
      [
        lint-backend,
        lint-frontend,
        lint-python,
        lint-shell,
        test-scripts,
        dockerfile-scan,
        dependency-review,
        test-backend,
        test-frontend,
        test-frontend-browser-ui,
        test-e2e-browser,
        test-e2e-browser-lifecycle,
        test-verification-agent,
        e2e-verification-agent-podman,
        test-filesystems,
        test-upgrade,
        lint-workflows,
        build-image,
        build-verification-image,
        code-scanning,
      ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-release]') }}
    outputs:
      should_release: ${{ steps.version_bump.outputs.should_release }}
      new_version: ${{ steps.version_bump.outputs.new_version }}
      bump_type: ${{ steps.version_bump.outputs.bump_type }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'node npm:semver'

      - name: Get current version
        id: current_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "current_version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${LATEST_TAG#v}"

      - name: Analyze commits and determine version bump
        id: version_bump
        shell: bash
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Get commits since last tag
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          fi

          echo "Analyzing commits:"
          echo "$COMMITS"

          # Initialize flags
          HAS_FEATURE=false
          HAS_FIX=false
          HAS_BREAKING=false

          # Analyze each commit - USE PROCESS SUBSTITUTION to avoid subshell variable scope issues
          while IFS= read -r commit; do
            if [[ "$commit" =~ ^FEATURE ]]; then
              HAS_FEATURE=true
              echo "Found FEATURE commit: $commit"
            elif [[ "$commit" =~ ^FIX ]]; then
              HAS_FIX=true
              echo "Found FIX commit: $commit"
            elif [[ "$commit" =~ ^REFACTOR ]]; then
              HAS_FIX=true  # Treat refactor as patch
              echo "Found REFACTOR commit: $commit"
            fi

            # Check for breaking changes
            if [[ "$commit" =~ BREAKING[[:space:]]CHANGE ]] || [[ "$commit" =~ "!" ]]; then
              HAS_BREAKING=true
              echo "Found BREAKING CHANGE: $commit"
            fi
          done < <(printf '%s\n' "$COMMITS")

          # Determine version bump
          if [ "$HAS_BREAKING" = true ]; then
            BUMP_TYPE="major"
          elif [ "$HAS_FEATURE" = true ]; then
            BUMP_TYPE="minor"
          elif [ "$HAS_FIX" = true ]; then
            BUMP_TYPE="patch"
          else
            BUMP_TYPE="none"
          fi

          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

          if [ "$BUMP_TYPE" != "none" ]; then
            NEW_VERSION=$(semver -i $BUMP_TYPE $CURRENT_VERSION)
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New version will be: $NEW_VERSION"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No version bump needed"
          fi

  push-image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARTIFACT_NAME: digests-release-${{ matrix.arch }}
      ARTIFACT_PATH: /tmp/digests/*
      ARTIFACT_TIMEOUT_MINUTES: '3'
      ARTIFACT_COMPRESSION_LEVEL: '6'
    needs: [determine-version, build-image]
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-x64
          - arch: arm64
            platform: linux/arm64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image by digest
        id: release-image-push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.determine-version.outputs.new_version }}
          outputs: type=image,name=databasus/databasus,push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.release-image-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - *upload-artifact-1

      - *upload-artifact-2

      - *upload-artifact-3

  merge-image-manifest:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 10
    env:
      ARTIFACT_NAME: ''
      ARTIFACT_PATTERN: digests-release-*
      ARTIFACT_PATH: /tmp/digests
      ARTIFACT_MERGE_MULTIPLE: 'true'
    needs: [determine-version, push-image]
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - *download-artifact-1

      - *download-artifact-2

      - *download-artifact-3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both tag sets are assembled from the same per-platform digests, so the
      # ghcr.io mirror cannot drift from the released image.
      - name: Create multi-arch release manifests
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.determine-version.outputs.new_version }}
        run: |
          platform_image_refs=()
          for digest in *; do
            platform_image_refs+=("databasus/databasus@sha256:${digest}")
          done

          docker buildx imagetools create \
            -t databasus/databasus:latest \
            -t "databasus/databasus:v${VERSION}" \
            -t "databasus/databasus:${{ github.sha }}" \
            "${platform_image_refs[@]}"

          docker buildx imagetools create \
            -t ghcr.io/databasus/databasus:latest \
            -t "ghcr.io/databasus/databasus:v${VERSION}" \
            -t "ghcr.io/databasus/databasus:${{ github.sha }}" \
            "${platform_image_refs[@]}"

  push-verification-image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARTIFACT_NAME: digests-verification-${{ matrix.major }}-${{ matrix.arch }}
      ARTIFACT_PATH: /tmp/digests/*
      ARTIFACT_TIMEOUT_MINUTES: '3'
      ARTIFACT_COMPRESSION_LEVEL: '6'
    needs: [determine-version, build-verification-image]
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        major: ['12', '13', '14', '15', '16', '17', '18']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-x64
          - arch: arm64
            platform: linux/arm64
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pin the base to its current manifest digest so the published image is
      # reproducible rather than tracking a floating postgres:<major> tag.
      - name: Resolve digest-pinned base image
        id: pinned-base-image
        run: |
          # buildx v0.32.1 on Namespace runners ignores --format and prints the full
          # summary, so the digest is hashed from the raw manifest bytes instead.
          manifest_hash=$(docker buildx imagetools inspect --raw postgres:${{ matrix.major }} | sha256sum | cut -d' ' -f1)
          echo "image=postgres:${{ matrix.major }}@sha256:${manifest_hash}" >> "$GITHUB_OUTPUT"

      - name: Build and push verification image by digest
        id: verification-image-push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: backend/cmd/verification-agent/images/postgres
          platforms: ${{ matrix.platform }}
          build-args: |
            PG_MAJOR=${{ matrix.major }}
            BASE_IMAGE=${{ steps.pinned-base-image.outputs.image }}
          outputs: type=image,name=databasus/verification-postgres,push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.verification-image-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - *upload-artifact-1

      - *upload-artifact-2

      - *upload-artifact-3

  merge-verification-image-manifest:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 10
    env:
      ARTIFACT_NAME: ''
      ARTIFACT_PATTERN: digests-verification-${{ matrix.major }}-*
      ARTIFACT_PATH: /tmp/digests
      ARTIFACT_MERGE_MULTIPLE: 'true'
    needs: [determine-version, push-verification-image]
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        major: ['12', '13', '14', '15', '16', '17', '18']
    steps:
      - *download-artifact-1

      - *download-artifact-2

      - *download-artifact-3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch verification manifest
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.determine-version.outputs.new_version }}
        run: |
          platform_image_refs=()
          for digest in *; do
            platform_image_refs+=("databasus/verification-postgres@sha256:${digest}")
          done

          docker buildx imagetools create \
            -t "databasus/verification-postgres:${{ matrix.major }}" \
            -t "databasus/verification-postgres:${{ matrix.major }}-v${VERSION}" \
            "${platform_image_refs[@]}"

  release:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 10
    needs: [determine-version, merge-image-manifest, merge-verification-image-manifest]
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          NEW_VERSION="${{ needs.determine-version.outputs.new_version }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Get commits since last tag
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s|%H|%an|%ad" --date=short --no-merges)
          else
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s|%H|%an|%ad" --date=short --no-merges)
          fi

          # Build the changelog with real newlines (NL) instead of \n literals
          # so we don't have to round-trip through `echo -e`. echo -e interprets
          # backslash sequences inside commit subjects (e.g. "\c" suppresses
          # further output) which can silently truncate the changelog and break
          # the GitHub Actions multiline-output heredoc parser.
          NL=$'\n'
          CHANGELOG="# Changelog${NL}${NL}## [${NEW_VERSION}] - $(date +%Y-%m-%d)${NL}${NL}"

          # Group commits by type and area
          FEATURES=""
          FIXES=""
          REFACTORS=""

          # USE PROCESS SUBSTITUTION to avoid subshell variable scope issues
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              COMMIT_MSG=$(echo "$line" | cut -d'|' -f1)
              COMMIT_HASH=$(echo "$line" | cut -d'|' -f2)
              SHORT_HASH=${COMMIT_HASH:0:7}

              # Parse commit message format: TYPE (area): description
              if [[ "$COMMIT_MSG" == FEATURE* ]]; then
                TEMP="${COMMIT_MSG#FEATURE}"
                TEMP="${TEMP#"${TEMP%%[![:space:]]*}"}"
                if [[ "$TEMP" == \(* ]]; then
                  AREA="${TEMP%%)*}"
                  AREA="${AREA#(}"
                  DESC="${TEMP#*)}"
                  DESC="${DESC#:}"
                  DESC="${DESC#"${DESC%%[![:space:]]*}"}"
                  FEATURES="${FEATURES}- **${AREA}**: ${DESC} ([${SHORT_HASH}](https://github.com/${{ github.repository }}/commit/${COMMIT_HASH}))${NL}"
                fi
              elif [[ "$COMMIT_MSG" == FIX* ]]; then
                TEMP="${COMMIT_MSG#FIX}"
                TEMP="${TEMP#"${TEMP%%[![:space:]]*}"}"
                if [[ "$TEMP" == \(* ]]; then
                  AREA="${TEMP%%)*}"
                  AREA="${AREA#(}"
                  DESC="${TEMP#*)}"
                  DESC="${DESC#:}"
                  DESC="${DESC#"${DESC%%[![:space:]]*}"}"
                  FIXES="${FIXES}- **${AREA}**: ${DESC} ([${SHORT_HASH}](https://github.com/${{ github.repository }}/commit/${COMMIT_HASH}))${NL}"
                fi
              elif [[ "$COMMIT_MSG" == REFACTOR* ]]; then
                TEMP="${COMMIT_MSG#REFACTOR}"
                TEMP="${TEMP#"${TEMP%%[![:space:]]*}"}"
                if [[ "$TEMP" == \(* ]]; then
                  AREA="${TEMP%%)*}"
                  AREA="${AREA#(}"
                  DESC="${TEMP#*)}"
                  DESC="${DESC#:}"
                  DESC="${DESC#"${DESC%%[![:space:]]*}"}"
                  REFACTORS="${REFACTORS}- **${AREA}**: ${DESC} ([${SHORT_HASH}](https://github.com/${{ github.repository }}/commit/${COMMIT_HASH}))${NL}"
                fi
              fi
            fi
          done < <(printf '%s\n' "$COMMITS")

          # Build changelog sections
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### ✨ Features${NL}${FEATURES}${NL}"
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes${NL}${FIXES}${NL}"
          fi

          if [ -n "$REFACTORS" ]; then
            CHANGELOG="${CHANGELOG}### 🔨 Refactoring${NL}${REFACTORS}${NL}"
          fi

          # Add Docker image info
          CHANGELOG="${CHANGELOG}### 🐳 Docker${NL}"
          CHANGELOG="${CHANGELOG}- **Image**: \`databasus/databasus:v${NEW_VERSION}\`${NL}"
          CHANGELOG="${CHANGELOG}- **Mirror**: \`ghcr.io/databasus/databasus:v${NEW_VERSION}\`${NL}"
          CHANGELOG="${CHANGELOG}- **Platforms**: linux/amd64, linux/arm64${NL}"

          # Use a random delimiter so any literal "EOF" line inside the
          # changelog (e.g. inside a commit subject) cannot prematurely
          # terminate the multiline output heredoc.
          DELIMITER="EOF_$(openssl rand -hex 16)"
          {
            printf '%s<<%s\n' 'changelog' "$DELIMITER"
            printf '%s\n' "$CHANGELOG"
            printf '%s\n' "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.determine-version.outputs.new_version }}
          release_name: Release v${{ needs.determine-version.outputs.new_version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  publish-helm-chart:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 10
    needs: [determine-version, merge-image-manifest]
    if: ${{ needs.determine-version.outputs.should_release == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'helm'

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update Chart.yaml with release version
        run: |
          VERSION="${{ needs.determine-version.outputs.new_version }}"
          sed -i "s/^version: .*/version: ${VERSION}/" deploy/helm/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"v${VERSION}\"/" deploy/helm/Chart.yaml
          cat deploy/helm/Chart.yaml

      - name: Package Helm chart
        run: helm package deploy/helm --destination .

      - name: Push Helm chart to GHCR
        run: |
          VERSION="${{ needs.determine-version.outputs.new_version }}"
          helm push databasus-${VERSION}.tgz oci://ghcr.io/databasus/charts
