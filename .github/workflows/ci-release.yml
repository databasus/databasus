            if [ "$http" != "200" ]; then
              echo "verification agent ($arch) download failed: HTTP $http"
              head -c 200 "$out" || true
              docker logs databasus-smoke
              rm -f "$out"
              exit 1
            fi
            magic=$(head -c 4 "$out" | od -An -t x1 | tr -d ' ')
            if [ "$magic" != "7f454c46" ]; then
              echo "verification agent ($arch) is not an ELF binary (first 4 bytes: $magic)"
              head -c 200 "$out" || true
              docker logs databasus-smoke
              rm -f "$out"
              exit 1
            fi
            size=$(stat -c%s "$out")
            echo "verification agent ($arch) OK (${size} bytes)"
            rm -f "$out"
          done

          # A console command is the only user of the credential start.sh publishes for
          # processes that miss PID 1's environment, so nothing else here notices when
          # publishing breaks.
          echo "Checking that a console command reaches the metadata database..."
          console_output=$(mktemp)
          if ! docker exec databasus-smoke ./main --list-admins >"$console_output" 2>&1; then
            echo "console command could not reach the metadata database"
            cat "$console_output"
            docker logs databasus-smoke
            rm -f "$console_output"
            exit 1
          fi
          rm -f "$console_output"
          echo "console command OK"

          # A broken non-PostgreSQL bundle only logs a warning and disables that engine,
          # so the container stays healthy. The image ships every bundle, so any such
          # warning here means one of them cannot run in the image.
          echo "Checking that every bundled client tool runs in the image..."
          if docker logs databasus-smoke 2>&1 | grep -F "client tools check failed"; then
            echo "a bundled client tool cannot run in the image"
            exit 1
          fi
          echo "client tools OK"

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --batch --no-tty --yes --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy scan release image (CRITICAL, blocking)
        run: trivy image --severity CRITICAL --ignore-unfixed --pkg-types os,library --scanners vuln --exit-code 1 databasus:smoke-${{ github.sha }}

      - name: Trivy scan release image (HIGH, advisory)
        if: always()
        run: trivy image --severity HIGH --ignore-unfixed --pkg-types os,library --scanners vuln --exit-code 0 databasus:smoke-${{ github.sha }}

      - name: Cleanup smoke container
