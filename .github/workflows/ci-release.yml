name: CI and Release

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

# A pull request from develop runs no checks: the push to main after its merge runs them.
jobs:
  lint-backend:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Download Go modules
        run: |
          cd backend
          go mod download

      - name: Verify Go module checksums
        run: |
          cd backend
          go mod verify

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: |
          cd backend
          golangci-lint run

      - name: Run archlint
        run: |
          cd backend
          go run ./tools/archlint

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan for reachable vulnerabilities
        run: |
          cd backend
          govulncheck ./...

      - name: Verify go mod tidy
        run: |
          cd backend
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go mod tidy made changes, please run 'go mod tidy' and commit the changes" && exit 1)

  lint-frontend:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "node pnpm"

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          cd frontend
          pnpm format:check

      - name: Check if linter was run
        run: |
          cd frontend
          pnpm lint

      - name: Build frontend
        run: |
          cd frontend
          pnpm build

  lint-shell:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "just shellcheck"

      - name: Run shellcheck
        run: just lint-shell

  dockerfile-scan:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --batch --no-tty --yes --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy Dockerfile misconfiguration scan
        run: |
          trivy config --severity HIGH,CRITICAL --exit-code 1 Dockerfile
          trivy config --severity HIGH,CRITICAL --exit-code 1 agent/verification/images/postgres/Dockerfile

  test-frontend:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 15
    needs: [lint-frontend]
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Set up pnpm cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: pnpm

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm test

  lint-verification-agent:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Download Go modules
        run: |
          cd agent/verification
          go mod download

      - name: Verify Go module checksums
        run: |
          cd agent/verification
          go mod verify

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: |
          cd agent/verification
          golangci-lint run

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan for reachable vulnerabilities
        run: |
          cd agent/verification
          govulncheck ./...

      - name: Verify go mod tidy
        run: |
          cd agent/verification
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go mod tidy made changes, please run 'go mod tidy' and commit the changes" && exit 1)

  test-verification-agent:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 15
    needs: [lint-verification-agent]
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Download Go modules
        run: |
          cd agent/verification
          go mod download

      - name: Run Go tests
        run: |
          cd agent/verification
          go test -race -count=1 -failfast ./internal/...

  e2e-verification-agent:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 30
    needs: [lint-verification-agent]
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "just"

      - name: Run e2e tests
        run: |
          cd agent/verification
          just e2e

      - name: Cleanup
        if: always()
        run: |
          cd agent/verification/e2e
          docker compose down -v --rmi local || true
          rm -rf artifacts || true

  e2e-verification-agent-podman:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    # Namespace runners are containers without systemd whose seccomp profile denies
    # pivot_root, so rootful Podman cannot start containers there.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint-verification-agent]
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "just"

      - name: Start rootful Podman socket
        run: |
          sudo systemctl start podman.socket
          sudo podman version
          sudo podman info --format '{{.Host.OCIRuntime.Name}}'

      - name: Run e2e tests on Podman
        run: |
          cd agent/verification
          just e2e-podman

      - name: Cleanup
        if: always()
        run: |
          cd agent/verification/e2e
          docker compose down -v --rmi local || true
          rm -rf artifacts || true
          sudo podman ps -aq --filter label=databasus.verification.agent_id | xargs -r sudo podman rm -f || true
          sudo podman network ls -q --filter label=databasus.verification.agent_id | xargs -r sudo podman network rm || true

  test-backend:
    if: github.ref != 'refs/heads/develop' && github.head_ref != 'develop'
    # 22.04 runs Linux 6.8. ubuntu-24.04 moved to Linux 7.0, where mongod 9.0 exits at startup:
    # its kernel check reads Ubuntu's 7.0.0 release string as an rseq-incompatible kernel
    # (SERVER-121912, SERVER-136848).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Only other runs many packages at once. The rest run one to four packages, so twice the
        # vCPU would only hold a larger share of the concurrency limit.
        include:
          - group: other
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-x64
          - group: logical
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: physical-1-of-3
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: physical-2-of-3
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: physical-3-of-3
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: wal-usecases-1-of-3
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: wal-usecases-2-of-3
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
          - group: wal-usecases-3-of-3
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-x64
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Install database client dependencies
        run: |
          # The bundled assets/tools clients are Debian-built; Ubuntu ships no libncurses5/libtinfo5
          # package at all, and the ABI-identical .so.6 satisfies them via these symlinks.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libedit2 libncurses6 libtinfo6 libpq5 libmariadb3 libgnutls30 zstd netcat-openbsd
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Download Go modules
        run: |
          cd backend
          go mod download

      - name: Create .env file for testing
        run: cp .env.example .env

      - name: Start test containers
        run: |
          docker compose -f docker-compose.yml up -d

      - name: Wait for containers to be ready
        run: |
          # Wait for main dev database (postgres listens on 5432 inside the container)
          timeout 60 bash -c 'until docker exec backend-db pg_isready -U postgres; do sleep 2; done'

          # Wait for test database (postgres listens on 5432 inside the container)
          timeout 60 bash -c 'until docker exec backend-db-test pg_isready -U postgres; do sleep 2; done'

          # 5004 = shared logical-postgres-16 fixture; 5007-5008 = shared physical-postgres 17/18
          # primary sources. The per-version, no-summary, tablespace, mTLS and restore-target
          # physical containers — like the per-version logical PG tests — run on testcontainers and
          # need no fixed port.
          timeout 60 bash -c 'until nc -z 127.0.0.1 5004; do sleep 2; done'
          timeout 60 bash -c 'until nc -z 127.0.0.1 5007; do sleep 2; done'
          timeout 60 bash -c 'until nc -z 127.0.0.1 5008; do sleep 2; done'

      - name: Create data and temp directories
        run: |
          # Create directories that are used for backups and restore
          # These paths match what's configured in config.go
          mkdir -p databasus-data/backups
          mkdir -p databasus-data/temp

      - name: Provision per-worker test databases and run migrations
        env:
          TEST_PARALLEL_WORKERS: "8"
        run: |
          cd backend
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.1
          go_binary_directory="$(go env GOPATH)/bin"
          export PATH="${go_binary_directory}:${PATH}"
          set -a && . ../.env && set +a
          # cleanup_test_db creates databasus_w0..w{workers-1} and resets the test PG
          # containers. Then migrate each slot DB so every
          # parallel `go test` worker connects to a migrated metadata DB.
          go run -tags testhelpers ./cmd/cleanup_test_db
          for i in $(seq 0 $((TEST_PARALLEL_WORKERS - 1))); do
            dbstring=$(echo "$GOOSE_TEST_DBSTRING" | sed -E "s#/([^/?]+)\?#/\1_w$i?#")
            echo "migrating slot $i"
            GOOSE_DBSTRING="$dbstring" goose -dir ./migrations up
          done

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "just"

      - name: Pull testcontainer images
        run: just pull-testcontainers

      - name: Run Go tests
        env:
          # Ryuk stays disabled to match scripts/test.sh, so CI and local runs share one code path.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # Each package runs in its own metadata DB, so packages run in parallel.
          # -p must equal the provisioned worker count.
          TEST_PARALLEL_WORKERS: "8"
          TEST_GROUP: ${{ matrix.group }}
        run: |
          cd backend
          # Separate assignments let a failing recipe stop the step instead of running no tests.
          packages=$(just test-group-packages "$TEST_GROUP")
          run_pattern=$(just test-group-tests "$TEST_GROUP")
          # Each leg runs one group on its own runner, so a group needs more wall-clock than the
          # 15m scripts/test.sh allows on a developer machine.
          # shellcheck disable=SC2086 # one import path per word
          go test -race -tags testhelpers -p=8 -count=1 -failfast -timeout 40m ${run_pattern:+-run "$run_pattern"} $packages

  build-storage-image:
    if: github.head_ref != 'develop'
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build amd64 storage candidate and load locally
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=storage-${{ github.sha }}
          tags: databasus-storage-test:${{ github.sha }}

      - name: Export the storage candidate
        run: docker save databasus-storage-test:${{ github.sha }} | zstd -T0 -3 > /tmp/databasus-storage-test.tar.zst

      - name: Upload the storage candidate
        id: upload-the-storage-candidate-1
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: databasus-storage-test
          path: /tmp/databasus-storage-test.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload the storage candidate (attempt 2)
        id: upload-the-storage-candidate-2
        if: steps.upload-the-storage-candidate-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: databasus-storage-test
          path: /tmp/databasus-storage-test.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload the storage candidate (attempt 3)
        id: upload-the-storage-candidate-3
        if: steps.upload-the-storage-candidate-2.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: databasus-storage-test
          path: /tmp/databasus-storage-test.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  test-filesystems:
    if: github.head_ref != 'develop'
    needs: [build-storage-image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: permissions
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-x64
          - group: upgrades
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-x64
          - group: lifecycle
            runner: namespace-profile-2vcpu-4ram-ubuntu-26-x64
          # The Docker engine on Namespace runners has no CIFS or NFS kernel support, so
          # the network filesystem cases can only mount their volumes on GitHub runners.
          - group: network
            runner: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install network filesystem clients
        if: matrix.group == 'network'
        run: sudo apt-get update && sudo apt-get install -y cifs-utils nfs-common

      - name: Download the storage candidate
        id: download-the-storage-candidate-1
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Download the storage candidate (attempt 2)
        id: download-the-storage-candidate-2
        if: steps.download-the-storage-candidate-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Download the storage candidate (attempt 3)
        id: download-the-storage-candidate-3
        if: steps.download-the-storage-candidate-2.outcome == 'failure'
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test
          path: /tmp

      - name: Load the storage candidate
        run: zstd -dc /tmp/databasus-storage-test.tar.zst | docker load

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "just"

      - name: Run filesystem suite
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ github.sha }}
          CASE_GROUP: ${{ matrix.group }}
        run: just test-filesystem

  build-dev-image:
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build amd64 dev image and load locally
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=dev-${{ github.sha }}
          tags: |
            databasus-dev:smoke-${{ github.sha }}

      - name: Run smoke pings against dev image
        run: |
          # 0770 keeps the traversal bit off for others, so the smoke run only passes
          # while the in-container postgres account reaches PGDATA through its group.
          mkdir -p /tmp/databasus-dev-smoke-data
          chmod 770 /tmp/databasus-dev-smoke-data
          docker run -d --name databasus-dev-smoke \
            -p 4005:4005 \
            -v /tmp/databasus-dev-smoke-data:/databasus-data \
            databasus-dev:smoke-${{ github.sha }}

          for i in $(seq 1 60); do
            health_body=$(mktemp)
            code=$(curl -s -o "$health_body" -w '%{http_code}' http://localhost:4005/api/v1/system/health || true)
            if [ "$code" = "200" ] && grep -q '"status"' "$health_body"; then
              echo "healthcheck OK after ${i} attempt(s)"
              rm -f "$health_body"
              break
            fi
            rm -f "$health_body"
            if [ "$i" -eq 60 ]; then
              echo "healthcheck never returned valid JSON (last code: ${code})"
              docker logs databasus-dev-smoke
              exit 1
            fi
            sleep 2
          done

          body=$(curl -sf http://localhost:4005/)
          if ! echo "$body" | grep -q 'id="root"'; then
            echo "index.html did not contain React root div"
            echo "$body"
            exit 1
          fi
          echo "index.html OK"

          for arch in amd64 arm64; do
            echo "Checking verification agent download for $arch..."
            out=$(mktemp)
            http=$(curl -sS -o "$out" -w '%{http_code}' "http://localhost:4005/api/v1/system/verification-agent?arch=$arch")
            if [ "$http" != "200" ]; then
              echo "verification agent ($arch) download failed: HTTP $http"
              head -c 200 "$out" || true
              docker logs databasus-dev-smoke
              rm -f "$out"
              exit 1
            fi
            magic=$(head -c 4 "$out" | od -An -t x1 | tr -d ' ')
            if [ "$magic" != "7f454c46" ]; then
              echo "verification agent ($arch) is not an ELF binary (first 4 bytes: $magic)"
              head -c 200 "$out" || true
              docker logs databasus-dev-smoke
              rm -f "$out"
              exit 1
            fi
            size=$(stat -c%s "$out")
            echo "verification agent ($arch) OK (${size} bytes)"
            rm -f "$out"
          done

          # A console command is the only user of the credential start.sh publishes for
          # processes that miss PID 1's environment, so nothing else here notices when
          # publishing breaks.
          echo "Checking that a console command reaches the metadata database..."
          console_output=$(mktemp)
          if ! docker exec databasus-dev-smoke ./main --list-admins >"$console_output" 2>&1; then
            echo "console command could not reach the metadata database"
            cat "$console_output"
            docker logs databasus-dev-smoke
            rm -f "$console_output"
            exit 1
          fi
          rm -f "$console_output"
          echo "console command OK"

          # A broken non-PostgreSQL bundle only logs a warning and disables that engine,
          # so the container stays healthy. The image ships every bundle, so any such
          # warning here means one of them cannot run in the image.
          echo "Checking that every bundled client tool runs in the image..."
          if docker logs databasus-dev-smoke 2>&1 | grep -F "client tools check failed"; then
            echo "a bundled client tool cannot run in the image"
            exit 1
          fi
          echo "client tools OK"

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --batch --no-tty --yes --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy scan dev image (CRITICAL, blocking)
        run: trivy image --severity CRITICAL --ignore-unfixed --pkg-types os,library --scanners vuln --exit-code 1 databasus-dev:smoke-${{ github.sha }}

      - name: Trivy scan dev image (HIGH, advisory)
        if: always()
        run: trivy image --severity HIGH --ignore-unfixed --pkg-types os,library --scanners vuln --exit-code 0 databasus-dev:smoke-${{ github.sha }}

      - name: Cleanup smoke container
        if: always()
        run: |
          docker rm -f databasus-dev-smoke || true
          docker rmi databasus-dev:smoke-${{ github.sha }} || true
          rm -rf /tmp/databasus-dev-smoke-data || true

  push-dev-image:
