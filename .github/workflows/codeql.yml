name: Code scanning

on:
  schedule:
    # CodeQL query packs and semgrep rulesets are updated over time; a scheduled
    # scan surfaces new findings even when no code has changed.
    - cron: "0 6 * * 1"
  # ci-release.yml uses the same security gate for releases and manual validation.
  workflow_call:
    inputs:
      is-release-gate:
        type: boolean
        required: true

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: namespace-profile-4vcpu-8ram-ubuntu-26-x64
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        if: matrix.language == 'go'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          category: "/language:${{ matrix.language }}"

  # The analysis uploads its results and passes whatever it found, so this job decides by severity.
  codeql-severity-gate:
    name: CodeQL severity gate
    needs: [analyze]
    if: inputs.is-release-gate
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'gh jq'

      - name: Check CodeQL alerts of the release analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check_codeql_alerts.sh "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # gitleaks scans every commit, so it needs the full history.
          fetch-depth: 0

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'gitleaks'

      # A release reads only its own history, so a finding on an unrelated branch cannot stop it.
      - name: Scan git history for secrets
        env:
          SCANNED_HISTORY: ${{ inputs.is-release-gate && 'HEAD' || '--all' }}
        run: mise run security:secrets

  semgrep:
    name: Analyze (semgrep)
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'python uv pypi:semgrep'

      # Private keys are left to gitleaks, which keeps the allowlist of test keys in .gitleaksignore.
      - name: Run semgrep
        run: mise run security:semgrep
