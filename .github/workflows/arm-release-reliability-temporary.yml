name: ARM release reliability verification (temporary)

on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: repairs
        options: [repairs, load, browser]
      candidate_run_id:
        type: string
      candidate_sha:
        type: string

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  verify-reliability:
    if: inputs.suite == 'repairs'
    name: verify-reliability (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-x64
          - arch: arm64
            runner: namespace-profile-8vcpu-16ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go golangci-lint jq'

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Install database client dependencies
        run: |
          # The bundled assets/tools clients are Debian-built; Ubuntu ships no libncurses5/libtinfo5
          # package at all, and the ABI-identical .so.6 satisfies them via these symlinks.
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev libedit2 libncurses6 libtinfo6 libpq5 libmariadb3 libgnutls30 zstd netcat-openbsd
          library_directory="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          sudo ln -sf "${library_directory}/libncurses.so.6" "${library_directory}/libncurses.so.5"
          sudo ln -sf "${library_directory}/libtinfo.so.6" "${library_directory}/libtinfo.so.5"

      - name: Download Go modules
        run: |
          cd backend
          go mod download

      - name: Create .env file for testing
        run: cp .env.example .env

      - name: Start test containers
        run: |
          docker compose -f docker-compose.yml up -d backend-db-test

      - name: Wait for containers to be ready
        run: |
          # Wait for test database (postgres listens on 5432 inside the container)
          timeout 60 bash -c 'until docker exec backend-db-test pg_isready -U postgres; do sleep 2; done'

      - name: Create data and temp directories
        run: |
          # Create directories that are used for backups and restore
          # These paths match what's configured in config.go
          mkdir -p databasus-data/backups
          mkdir -p databasus-data/temp

      - name: Pull testcontainer images
        run: mise run backend:pull-testcontainers

      - name: Prove the WAL timing test rejects the production interval
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: |
          cd backend
          python3 - <<'PYTHON'
          from pathlib import Path
          source = Path('internal/modules/backups/internal/physical/walstreaming/manager.go')
          original = source.read_text()
          needle = 'ForcedRotationInterval:    s.timings.ForcedRotationInterval,'
          assert original.count(needle) == 1
          source.write_text(original.replace(needle, 'ForcedRotationInterval:    5 * time.Minute,'))
          PYTHON
          if go test -race -count=1 -timeout 10m -run '^TestWalStreamTimings$' ./internal/app/apptest > /tmp/wal-production-interval.log 2>&1; then
            cat /tmp/wal-production-interval.log
            echo 'The timing regression accepted the production rotation interval' >&2
            exit 1
          fi
          cat /tmp/wal-production-interval.log
          grep -F 'no successful forced WAL switch' /tmp/wal-production-interval.log
          git restore -- internal/modules/backups/internal/physical/walstreaming/manager.go

      - name: Repeat the repaired WAL timing test ten times
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: |
          cd backend
          go test -race -parallel=2 -count=10 -timeout 20m -run '^TestWalStreamTimings$' ./internal/app/apptest

      - name: Repeat logical cancellation and notification delivery ten times
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: |
          cd backend
          go test -race -parallel=2 -count=10 -timeout 20m -run '^TestCancelLogicalBackup$' ./internal/modules/backups

  diagnose-logical-load:
    if: inputs.suite == 'load'
    name: diagnose-logical-load (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'go golangci-lint jq'

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: go

      - name: Install database client dependencies
        run: |
          # The bundled assets/tools clients are Debian-built; Ubuntu ships no libncurses5/libtinfo5
          # package at all, and the ABI-identical .so.6 satisfies them via these symlinks.
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev libedit2 libncurses6 libtinfo6 libpq5 libmariadb3 libgnutls30 zstd netcat-openbsd
          library_directory="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          sudo ln -sf "${library_directory}/libncurses.so.6" "${library_directory}/libncurses.so.5"
          sudo ln -sf "${library_directory}/libtinfo.so.6" "${library_directory}/libtinfo.so.5"

      - name: Download Go modules
        run: |
          cd backend
          go mod download

      - name: Create .env file for testing
        run: cp .env.example .env

      - name: Start test containers
        run: |
          docker compose -f docker-compose.yml up -d backend-db-test

      - name: Wait for containers to be ready
        run: |
          # Wait for test database (postgres listens on 5432 inside the container)
          timeout 60 bash -c 'until docker exec backend-db-test pg_isready -U postgres; do sleep 2; done'

      - name: Create data and temp directories
        run: |
          # Create directories that are used for backups and restore
          # These paths match what's configured in config.go
          mkdir -p databasus-data/backups
          mkdir -p databasus-data/temp

      - name: Pull testcontainer images
        run: mise run backend:pull-testcontainers

      - name: Compare logical concurrency with an A B A experiment
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          GOMAXPROCS: '4'
        run: |
          cd backend
          sample_resources() {
            while true; do
              date -u
              for resource in /proc/loadavg /proc/pressure/{cpu,memory,io} /sys/fs/cgroup/{cpu.stat,memory.current,memory.peak,memory.events}; do
                if [ -r "$resource" ]; then
                  echo "$resource"
                  cat "$resource"
                fi
              done
              timeout 10 docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} memory={{.MemUsage}}' || true
              sleep 5
            done
          }
          for phase in A-before B A-after; do
            parallelism=4
            if [ "$phase" = B ]; then parallelism=2; fi
            sample_resources > "/tmp/logical-load-$phase-pressure.log" 2>&1 &
            sampler_pid=$!
            trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
            status=0
            go test -race -p=8 -parallel="$parallelism" -count=1 -timeout 25m ./internal/modules/backups/e2e/mysql ./internal/modules/backups/e2e/mariadb ./internal/modules/backups/e2e/mongodb ./internal/modules/backups/e2e/postgresql > "/tmp/logical-load-$phase-tests.log" 2>&1 || status=$?
            kill "$sampler_pid" 2>/dev/null || true
            wait "$sampler_pid" 2>/dev/null || true
            trap - EXIT
            echo "$phase parallel=$parallelism exit=$status" | tee -a /tmp/logical-load-summary.log
            tail -n 30 "/tmp/logical-load-$phase-tests.log"
          done

      - name: Upload logical load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logical-load-arm64
          path: /tmp/logical-load-*.log
          retention-days: 7

  verify-browser-interruption:
    if: inputs.suite == 'browser'
    name: verify-browser-interruption (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Download the storage candidate
        id: download-the-storage-candidate-1
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test-${{ matrix.arch }}
          path: /tmp
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download the storage candidate (attempt 2)
        id: download-the-storage-candidate-2
        if: steps.download-the-storage-candidate-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test-${{ matrix.arch }}
          path: /tmp
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download the storage candidate (attempt 3)
        id: download-the-storage-candidate-3
        if: steps.download-the-storage-candidate-2.outcome == 'failure'
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test-${{ matrix.arch }}
          path: /tmp
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Load the storage candidate
        env:
          CANDIDATE_IMAGE: databasus-storage-test:${{ inputs.candidate_sha }}-${{ matrix.arch }}
        run: |
          zstd -dc /tmp/databasus-storage-test-${{ matrix.arch }}.tar.zst | docker load
          scripts/check_native_architecture.sh ${{ matrix.arch }} "$CANDIDATE_IMAGE"

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'python uv'

      - name: Check the suite's own code
        run: mise run e2e:unit

      - name: Verify interruption of the lifecycle command
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ inputs.candidate_sha }}-${{ matrix.arch }}
        run: uv run --locked --project e2e/browser pytest e2e/browser/lifecycle_interruption
