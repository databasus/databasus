name: Overlapping browser diagnostics (temporary)

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        type: string
        required: true
      candidate_sha:
        type: string
        required: true

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  verify-overlapping-runs:
    name: verify-overlapping-runs (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-4vcpu-8ram-ubuntu-26-x64
          - arch: arm64
            runner: namespace-profile-4vcpu-8ram-ubuntu-22-arm
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check native runner architecture
        run: scripts/check_native_architecture.sh ${{ matrix.arch }}

      - name: Download the storage candidate
        id: download-the-storage-candidate-1
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test-${{ matrix.arch }}
          path: /tmp
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download the storage candidate (attempt 2)
        id: download-the-storage-candidate-2
        if: steps.download-the-storage-candidate-1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test-${{ matrix.arch }}
          path: /tmp
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download the storage candidate (attempt 3)
        id: download-the-storage-candidate-3
        if: steps.download-the-storage-candidate-2.outcome == 'failure'
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: databasus-storage-test-${{ matrix.arch }}
          path: /tmp
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Load the storage candidate
        env:
          CANDIDATE_IMAGE: databasus-storage-test:${{ inputs.candidate_sha }}-${{ matrix.arch }}
        run: |
          zstd -dc /tmp/databasus-storage-test-${{ matrix.arch }}.tar.zst | docker load
          scripts/check_native_architecture.sh ${{ matrix.arch }} "$CANDIDATE_IMAGE"

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: 'python uv'

      - name: Check the suite's own code
        run: mise run e2e:unit

      - name: Repeat overlapping browser runs with lineage diagnostics
        env:
          DATABASUS_IMAGE: databasus-storage-test:${{ inputs.candidate_sha }}-${{ matrix.arch }}
        run: |
          for repetition in $(seq 1 10); do
            echo "Overlapping browser run $repetition of 10"
            uv run --locked --project e2e/browser pytest e2e/browser/lifecycle/test_overlapping_runs.py -k both_pass
          done
