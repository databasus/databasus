name: Python quality

on:
  workflow_call:

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  lint-python:
    runs-on: namespace-profile-2vcpu-4ram-ubuntu-26-x64
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read locked mise bootstrap
        id: mise-bootstrap
        uses: ./.github/actions/read-mise-bootstrap

      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ steps.mise-bootstrap.outputs.version }}
          sha256: ${{ steps.mise-bootstrap.outputs.sha256 }}
          cache: false
          install_args: 'python uv ruff ty'

      - name: Check Python
        run: mise run python:lint

      - name: Check known dependency pins and vendored files
        run: mise run verify-deps
