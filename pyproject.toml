[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN", "RUF100", "PGH003", "PGH004"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["scripts", ".agent-hooks", "e2e/browser", "e2e/browser/scenarios"]

[tool.ty.rules]
blanket-ignore-comment = "error"
unused-ignore-comment = "error"
