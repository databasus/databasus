schema: spec-driven

context: |
  Databasus - PostgreSQL/MySQL/MariaDB/MongoDB backup and restore platform,
  self-hosted, Docker-deployed.

  Stack: Go + Gin + GORM + PostgreSQL (backend/, including the verification
  agent),
  React 19 + TypeScript + Vite + Ant Design 5 + Tailwind (frontend/),
  Next.js 16 static export (website/).

  The architecture is in docs/architecture.md, the test setup in
  docs/testing.md and the terms in docs/glossary.md. Per-folder rules live in
  backend/AGENTS.md, frontend/AGENTS.md, website/AGENTS.md; the root
  AGENTS.md holds the rules for every module. A change under a folder answers
  to both.

  Conventions that shape planning:
  - Load the repository Humanizer skill once per context, before the first
    OpenSpec message or action, as AGENTS.md says, and apply its embedded
    mode to all agent-authored prose. Preserve exact
    commands, paths, identifiers, schemas, templates, quotations and facts.
  - English only in code, comments, identifiers, API strings and commit
    messages. AGENTS.md enumerates every place translated end-user content
    is allowed; a change that needs another one amends that rule explicitly
    and with the user's approval, rather than assuming it.
  - No unrequested backward compatibility. A change that breaks callers,
    schemas, configs or APIs states the break; approved breaks delete the
    old code rather than leaving a shim.
  - No issue numbers in production code. The exception is a test pinning a
    specific issue's behavior.
  - Names state intent. Getters take Get, predicates read as questions,
    booleans take is/can/has/should.
  - Work happens on a Fedora host with the tools pinned in mise.toml.
    Commands are mise tasks (mise run <task>, from any directory)
    and pnpm (frontend).
  - Review hooks gate plans, finished turns, full proposals and full
    implementations. Resolve their findings as the "Review hooks" section
    of AGENTS.md says.
  - Refactor the code the change touches while implementing, as the
    "Refactoring within a feature" section of AGENTS.md says.

rules:
  proposal:
    - Humanize all prose in embedded mode before writing the artifact.
    - Name the module AGENTS.md files the change answers to.
    - Include an explicit out-of-scope list; scope creep is the main failure mode here.
    - Mark anything that breaks existing callers, schemas, configs or APIs as BREAKING, and say what gets deleted rather than kept as a shim.
  specs:
    - Humanize all prose in embedded mode before writing the artifact.
    - State behavior a user or a downstream system can observe. No Go types, React components, file paths or library names.
    - Security-relevant behavior gets its own requirement, not a footnote.
  design:
    - Humanize all prose in embedded mode before writing the artifact.
    - For each decision, name the alternatives rejected and why. A decision with no alternatives listed is a description, not a decision.
    - Ground claims about current state in file:line references.
    - Ground architecture decisions in docs/architecture.md and the module AGENTS.md architecture rules. A decision that changes the architecture changes docs/architecture.md in the same change.
    - Say which module AGENTS.md rules the approach is constrained by.
  tasks:
    - Humanize all prose in embedded mode before writing the artifact.
    - Each task's verification is a local command the agent runs itself, never "should work". Valid checks are the tests of the touched packages and of the packages that test the same feature (mise run backend:test-package ./internal/features/<feature>/...), mise run lint or a module lint task such as mise run backend:lint, mise run agent:build and mise run agent:test, pnpm lint, pnpm typecheck, pnpm test, pnpm build, or an automated test that pins the behavior.
    - Every task is one the agent can complete and verify on its own. Every task closes without the user stepping in and without the full backend suite. Keep these out of tasks and out of other tasks' verification, including a final verification task - the full backend suite (mise run test), the Docker filesystem suite (mise run test-filesystem), deploys, CI pipeline runs, any check that needs a push, and manual app runs or browser clicking. The full backend suite takes too long for a task's verification and runs only when the user asks.
    - Order by dependency, smallest slice first when the work is repetitive.
    - When the tasks add or change tests in a backend package, a verification agent package or the frontend, end tasks.md with a "## Change verification" section that runs every such package the tasks' verifications name. It is the last section, has no checkboxes and holds one code block fenced as sh, with one command per line. The implementing agent runs these commands before review; review only validates the section and reads the verification evidence. Allowed forms are mise run backend:test-package followed by package paths starting with ./ (resolved in backend/), mise run backend:test-group followed by physical, logical or physical-api shard names, mise run agent:test with nothing after it, pnpm --dir frontend test with optional test paths or filters, and exactly pnpm --dir frontend test:browser --project=ui or pnpm --dir frontend test:browser --project=e2e with no additional arguments. Arguments hold only letters, digits, dots, slashes, underscores, hyphens, equals signs, at signs and colons. The hook tests in .agent-hooks/ need no section; their tasks name an explicit local verification command instead.
    - End the task list at the pre-commit boundary. The change is complete when implementation, required documentation, verification and mandatory review are finished, and the working tree is ready to commit.
    - Never add tasks for committing, pushing, creating or updating a pull request, requesting pull request review, merging, or any later Git or repository-hosting workflow. Completion status updates must be ready for inclusion in the same commit as the implementation.

operations:
  apply:
    guidance:
      - Follow the implementation verification and review order in the Review hooks section of AGENTS.md.
      - Resolve every blocking review hook finding before finishing; never apply a scope finding without the user's consent.
      - Once the full implementation review accepts the change, write the full summary of the change. Open it by saying that the automatic review passed and accepted the change in its current state, and end with a short list of what the review made you fix.
      - Never commit or push without explicit approval. A "pack" request, as the OpenSpec section of AGENTS.md describes it, is approval to commit, not to push. No AI attribution trailers in commit messages.
  archive:
    guidance:
      - Confirm the module AGENTS.md files were updated if the change introduced a convention.
